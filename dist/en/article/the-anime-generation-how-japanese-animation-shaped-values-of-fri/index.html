    <script id="article-data" type="application/json">{"slug":"the-anime-generation-how-japanese-animation-shaped-values-of-fri","locale":"en","translationKey":"linkedin:7394537646963970048","path":"/en/article/the-anime-generation-how-japanese-animation-shaped-values-of-fri/","alternatePath":"/article/a-geracao-anime-como-a-tv-manchete-moldou-valores-de-amizade-e-justica/","title":"The Anime Generation: How Japanese Animation Shaped Values of Friendship and Justice","description":"How TV Manchete and Japanese anime morally formed a generation of Brazilians.","html":"<p>Those born between 1985-1995 in Brazil had an absolutely unique privilege. TV Manchete (from Rio) was the protagonist in importing Japanese anime here. In doing so, it morally shaped a generation of young people. These cartoons seemed &quot;silly&quot; and comical on the surface, but all of them delivered powerful lessons in every field: the fight of good against evil, the unwavering commitment to your friends, the duty to protect the oppressed, the sacrifice necessary to achieve great results. All these parameters were created for my generation, in large part, because of these shows. For this and other reasons, I am eternally grateful and an admirer of Japanese culture.</p>\n<p>The opening song lyrics are evidence, and a show in themselves:</p>\n<p><strong>Yu Yu Hakusho</strong></p>\n<p><em>&quot;...But I know how to decide because I grew up</em>\n<em>I&#39;m strong, I&#39;m ready to fight!</em>\n<em>I go crazy, and the energy and power will grow</em>\n<em>And suddenly, a latent desire beats</em>\n<em>To break limits and dream</em>\n<em>I go crazy, but a smile makes me understand, know why</em>\n<em>Someone forgets the pain and finds in love the strength to say</em>\n<em>Arigatou gozaimasu!&quot;</em></p>\n<p><strong>Dragon Ball Z:</strong></p>\n<p><em>&quot;I can sense danger and chaos</em>\n<em>And no one will scare me now</em>\n<em>With my mind, I go to a thousand places</em>\n<em>And imagination gives me strength to fly</em>\n<em>Dreams we wish to achieve</em>\n<em>To be someone with greater power than you already have</em>\n<em>Freedom is running through the sky</em>\n<em>Always united we will triumph</em>\n<em>And if our fight is for real</em>\n<em>I&#39;ll show my worth</em>\n<em>My commitment is to always win!&quot;</em></p>\n<p><strong>Saint Seiya (Knights of the Zodiac):</strong></p>\n<p><em>&quot;There&#39;s always someone in the cosmos helping the knight to win</em>\n<em>And only the winner can wear their golden armor</em>\n<em>I know this tournament will make our universe tremble</em>\n<em>Warriors are warriors</em>\n<em>In the stars is where their treasure lies</em>\n<em>It&#39;s in the constellations that the fight will begin</em>\n<em>And here good and evil until one of them wins&quot;</em></p>\n<p>This was a generation of kids who learned the value of friendship and justice, and that it&#39;s ALWAYS worth having hope and ACTING. Even when everything seems lost. <strong>Action Creates Hope.</strong></p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_quem-nasceu-entre-85-95-no-brasil-teve-um-activity-7394537646963970048-tRUR\">LinkedIn</a> on November 13, 2025.</em></p>\n","layout":"prose","date":"2025-11-13","status":"published","tags":["brazil","culture","linkedin-import","values"],"coverImage":null}</script>
