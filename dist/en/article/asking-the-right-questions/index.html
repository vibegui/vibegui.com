    <script id="article-data" type="application/json">{"slug":"asking-the-right-questions","locale":"en","translationKey":"article:asking-the-right-questions","path":"/en/article/asking-the-right-questions","title":"The Most Productive Thing I Did Today Was Answer Questions","description":"How GSD turned a messy SQLite-to-Supabase migration into 49 commits across 5 phases in 33 minutes — while I was working on 3 other projects.","html":"<p>The most productive thing I did today was not write code.</p>\n<p>It was answer questions.</p>\n<p>A framework called <a href=\"https://github.com/gsd-build/get-shit-done\">GSD</a> sat me down and asked what I actually wanted. Not &quot;describe the feature.&quot; More like — what are you trying to become? What&#39;s in scope? What&#39;s off limits? What does done look like? The kind of questions that make you realize you hadn&#39;t thought it through. I&#39;d been carrying a half-baked migration plan in my head for a week. Ten minutes of answering GSD&#39;s questions and I understood my own project better than I had all week.</p>\n<p>That&#39;s the shift. Not faster code. Better thinking before any code gets written.</p>\n<p>Then it went to work. Phase by phase — each one researched, planned, and executed autonomously. Between phases I&#39;d check in, answer more questions, course-correct. Most times it verified itself and moved on. 49 commits. 5 phases. 33 minutes of agent execution. A complete SQLite-to-Supabase migration — schema, import, sync pipeline, verification tests, the whole thing.</p>\n<p>I was working on three other projects simultaneously.</p>\n<h2>The first tool that treats AI like a project</h2>\n<p>Every AI coding tool I&#39;ve used treats software like a conversation. You prompt. It responds. The conversation ends. Context gone. Start over tomorrow.</p>\n<p><a href=\"https://github.com/gsd-build/get-shit-done\">GSD</a> treats it like a project. It runs on top of Claude Code, and the difference is structural.</p>\n<p>It maps your codebase. Interviews you. Researches the domain. Breaks the work into phased plans with success criteria. Executes with parallel agents. Then verifies — not &quot;did the tests pass&quot; but &quot;did the stated goal get achieved.&quot;</p>\n<p>And it remembers. Every step produces artifacts in a <code>.planning/</code> directory — state, roadmap, per-phase research, plans, verification reports. Come back in three weeks and pick up where you left off. No other AI coding tool does this.</p>\n<h2>What actually happened</h2>\n<p>This morning, vibegui.com was a mess. Half-finished SQLite migration from a week ago. Unstaged changes. Dead references everywhere. A custom YAML parser I&#39;d hacked together that occasionally mangled frontmatter. 52 articles in markdown files with no database backing. I&#39;d been avoiding this cleanup for days.</p>\n<p>I told GSD: complete the migration to Supabase-first.</p>\n<p>It started by mapping the codebase — seven structured documents covering stack, architecture, conventions, integrations, concerns. Then it interviewed me. Scope. Constraints. What&#39;s out of bounds. Captured everything into a PROJECT.md and produced 34 requirements traced to five phases.</p>\n<p>Then, phase by phase:</p>\n<ol>\n<li><strong>Migration cleanup</strong> (3 min) — Deleted every SQLite artifact, fixed stale references across package.json, vite config, READMEs. Build passes clean.</li>\n<li><strong>Parser foundation</strong> (8 min) — Replaced my hand-rolled YAML parser with gray-matter and Zod validation. Roundtrip fidelity tests for all 52 articles. That parser had been a source of quiet anxiety for weeks. Gone.</li>\n<li><strong>Supabase schema &amp; import</strong> (10 min) — Tables, triggers, search vectors, RLS policies. All 52 articles imported with tag management. Dry-run tested first.</li>\n<li><strong>Sync pipeline</strong> (2 min) — The reverse direction: Supabase back to markdown. SHA-256 hash comparison, dry-run mode, orphan detection.</li>\n<li><strong>Integration &amp; verification</strong> (10 min) — Pre-commit hooks, CRUD helpers with audit trails, 70 end-to-end tests across desktop and mobile. Full pipeline verified: Supabase → sync → generate → build → serve.</li>\n</ol>\n<p>33 minutes. 49 commits. 117 constraint tests passing, 70 E2E tests green.</p>\n<p>The whole time, I was jumping between this and three other projects. GSD held the context. I didn&#39;t have to.</p>\n<h2>The interview is the product</h2>\n<p>Voltaire said you judge a man not by his answers but by his questions. That applies to agents too.</p>\n<p>Most of the value I got today didn&#39;t come from the code agents wrote. It came from the questions GSD asked me before anything executed. Questions that challenged assumptions I didn&#39;t know I was making. Questions that surfaced edge cases I&#39;d been ignoring. Questions that confirmed the dubious stuff — the things I was 60% sure about but hadn&#39;t stress-tested.</p>\n<p>Formulating the right questions is the hard part. Any agent can generate code. The difference is whether it knows what to ask before it starts. I&#39;ve spent years studying Erhard&#39;s work on the power of language to shift context. GSD&#39;s interview loop is that principle made operational. The questions don&#39;t just capture requirements. They create clarity that didn&#39;t exist before. By the time agents started writing code, the hard thinking was already done.</p>\n<p>Cursor is incredible for flow-state coding. When I know what I&#39;m building and I&#39;m in the zone, nothing beats it. But Cursor is a conversation. No plan. No memory. No verification that what you built matches what you intended. For a focused task — fix this bug, add this component — it&#39;s perfect. For a multi-phase migration with dependencies between phases? It&#39;s a pen when you need an architecture firm.</p>\n<h2>Half my commands were /clear</h2>\n<p>About 50% of my GSD commands today were <code>/clear</code>. Context window fills up, you clear it, resume from disk, run the next phase. Clear again. The commands are verbose and it sometimes over-plans — a two-minute task gets a fifteen-minute planning cycle.</p>\n<p>But every time I think &quot;this is too much ceremony,&quot; I look at the git log.</p>\n<p>49 commits. Five phases. 33 minutes. All verified. While I was doing other things.</p>\n<p>The ceremony is the feature. It just needs better UX.</p>\n<h2>What comes next</h2>\n<p>I&#39;m working on a fork. GSD&#39;s bones are solid — I want to reuse as much of it as possible and rebuild the philosophical layer on top.</p>\n<p>You don&#39;t <em>plan</em> a future. You <em>declare</em> it. In Erhard and Zaffron&#39;s framework, a declared future isn&#39;t prediction or hope. It&#39;s a commitment that reorganizes action. &quot;Our company will be the leader in X&quot; isn&#39;t a forecast. It&#39;s a context that shifts how every decision gets made.</p>\n<p>Applied to agents: instead of &quot;plan the migration,&quot; you declare &quot;vibegui.com is Supabase-first with a complete sync pipeline, verification tests, and agent-friendly authoring tools.&quot; The system figures out the gap between current state and declared future, then works backward from the declaration.</p>\n<p>More on that soon.</p>\n","layout":"prose","date":"2026-02-16","status":"published","tags":[],"coverImage":"/images/articles/from-coder-to-conductor.jpeg"}</script>
