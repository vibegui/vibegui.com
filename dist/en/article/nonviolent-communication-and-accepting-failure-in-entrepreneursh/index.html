    <script id="article-data" type="application/json">{"slug":"nonviolent-communication-and-accepting-failure-in-entrepreneursh","locale":"en","translationKey":"linkedin:7270425110925234177","path":"/en/article/nonviolent-communication-and-accepting-failure-in-entrepreneursh/","alternatePath":"/article/comunicacao-nao-violenta-e-a-aceitacao-da-falha-no-empreendedorismo/","title":"Nonviolent Communication and Accepting Failure in Entrepreneurship","description":"How accepting the possibility of failure creates the freedom to actually deal with problems.","html":"<p>All violent (or sarcastic) communication hides a person frustrated with something that feels like a great threat to them.</p>\n<p>When I get angry about something that happened at the company and react with my team, I&#39;m merely externalizing the frustration of perceiving myself as failing (and forcing others to pay for it).</p>\n<p>After all, I only get angry when something is blatantly misaligned with our declared future. But who put our future there, ultimately? I did. Who put the team there, ultimately? I did. Who created the conversations and biases of how the team operates, guess who... I did.</p>\n<p>So, if something isn&#39;t working... all the PowerPoint arrows point to me. It feels, inside my head, like a threat to my identity as a leader, as an entrepreneur, and as a product developer.</p>\n<p>The counterintuitive &quot;solution&quot; to escape this trap, I discovered, is: <strong>ACCEPT THE POSSIBILITY OF FAILING.</strong> In other words, when seeing something broken, instead of finding it inadmissible and forbidden (me failing), find it curious and intriguing: &quot;wow! With this wonderful team and my best efforts, I failed. Let&#39;s find out why...&quot;</p>\n<p>Done—it already generates immense freedom to deal with what&#39;s not working in a pragmatic way without abducting anyone. In the end, it&#39;s all ego. Violent reaction is always the ego defending itself. True freedom, which generates serenity and empathy, is accepting with a full heart: I&#39;m an idiot, I fail and will fail. Everyone is giving their best, including me. Now let&#39;s get to work.</p>\n<p><em>PS: despite having clarity on this distinction, this is far from meaning I&#39;m immune to occasionally losing it... as my team well knows 🥲 🙏</em></p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_toda-comunica%C3%A7%C3%A3o-violenta-ou-sarc%C3%A1stica-activity-7270425110925234177-7klV\">LinkedIn</a> on December 5, 2024.</em></p>\n","layout":"prose","date":"2024-12-05","status":"published","tags":["emotional-intelligence","entrepreneurship","leadership","linkedin-import"],"coverImage":null}</script>
