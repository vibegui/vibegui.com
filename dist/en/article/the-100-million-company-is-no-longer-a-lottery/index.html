 var(--story-lime) 14%, transparent),\n    0 0 1.25rem color-mix(in srgb, var(--story-lime) 12%, transparent), 0 0.6rem\n    1.4rem color-mix(in srgb, #000 12%, transparent);\n  transform: translate(-50%, -50%) scale(1.03);\n}\n\n.story-flywheel-node.is-active b {\n  color: color-mix(in srgb, var(--story-lime) 80%, var(--color-fg));\n}\n\n.story-flywheel-node-1 {\n  top: var(--orbit-inset);\n  left: 50%;\n}\n\n.story-flywheel-node-2 {\n  top: 50%;\n  left: calc(100% - var(--orbit-inset));\n}\n\n.story-flywheel-node-3 {\n  top: calc(100% - var(--orbit-inset));\n  left: 50%;\n}\n\n.story-flywheel-node-4 {\n  top: 50%;\n  left: var(--orbit-inset);\n}\n\n.story-flywheel-comet {\n  position: absolute;\n  inset: var(--orbit-inset);\n  border-radius: 50%;\n  pointer-events: none;\n  z-index: 2;\n  animation: story-orbit var(--orbit-period) linear infinite;\n}\n\n.story-flywheel-comet::before {\n  position: absolute;\n  top: 0;\n  left: 50%;\n  width: 0.7rem;\n  height: 0.7rem;\n  border-radius: 50%;\n  background: color-mix(in srgb, var(--story-lime) 88%, #fff);\n  box-shadow: 0 0 0.85rem color-mix(in srgb, var(--story-lime) 45%, transparent);\n  transform: translate(-50%, -50%);\n  content: \"\";\n}\n\n.story-flywheel-comet::after {\n  position: absolute;\n  top: 0;\n  left: 50%;\n  width: 1.6rem;\n  height: 0.3rem;\n  border-radius: 999px;\n  background: linear-gradient(\n    90deg,\n    transparent 0%,\n    color-mix(in srgb, var(--story-lime) 35%, transparent) 100%\n  );\n  opacity: 0.45;\n  filter: blur(1px);\n  transform: translate(-90%, -50%);\n  content: \"\";\n}\n\n@keyframes story-orbit {\n  to {\n    transform: rotate(1turn);\n  }\n}\n\n@keyframes story-ring-drift {\n  to {\n    stroke-dashoffset: -24;\n  }\n}\n\n.story-growth ol {\n  display: grid;\n  gap: 1rem;\n  margin: 0;\n  padding: 0;\n  list-style: none;\n}\n\n.story-growth li {\n  display: grid;\n  grid-template-columns: 6.5rem 1fr;\n  align-items: center;\n  gap: 1rem;\n  margin: 0;\n}\n\n.story-growth y-local-network span {\n  color: var(--color-fg-muted);\n  font-size: 0.6875rem;\n}\n\n.story-local-global strong {\n  max-width: 9ch;\n  color: var(--color-fg);\n  font-family: var(--font-serif);\n  font-size: 1.35rem;\n  line-height: 1.05;\n}\n\n.story-local-global i {\n  position: absolute;\n  inset: 12%;\n  border: 1px solid var(--story-line);\n  border-radius: 50%;\n}\n\n.story-local-shift {\n  color: var(--story-green);\n  font-size: 2rem;\n}\n\n.story-local-network {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 1rem;\n}\n\n.story-local-network > div {\n  position: relative;\n  display: flex;\n  min-width: 0;\n  min-height: 6rem;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n}\n\n.story-local-network i {\n  position: absolute;\n  inset: 0;\n  border: 1px solid var(--story-line);\n  border-radius: 50%;\n  animation: story-pulse 4s cubic-bezier(0.22, 1, 0.36, 1) infinite;\n}\n\n.story-local-network > div:nth-child(2n) i {\n  animation-delay: -2s;\n}\n\n.story-local-network strong {\n  color: var(--story-green);\n  font-family: var(--font-mono);\n  font-size: clamp(0.9rem, 2vw, 1.2rem);\n  font-variant-numeric: tabular-nums;\n}\n\n.story-local figcaption {\n  grid-column: 1 / -1;\n}\n\n@keyframes story-pulse {\n  50% {\n    border-color: var(--story-lime);\n    box-shadow: 0 0 1.5rem\n      color-mix(in srgb, var(--story-lime) 24%, transparent);\n    transform: scale(1.04);\n  }\n}\n\n.story-cta {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 1.5rem;\n  padding: clamp(1.5rem, 5vw, 3rem);\n  border-radius: 1.25rem;\n  background: var(--story-lime);\n  color: #07401a;\n}\n\n.story-cta span {\n  max-width: 30ch;\n  font-family: var(--font-serif);\n  font-size: clamp(1.25rem, 3vw, 2rem);\n  line-height: 1.1;\n}\n\n.story-cta a {\n  display: inline-flex;\n  min-height: 2.75rem;\n  align-items: center;\n  padding-block: 0.5rem;\n  color: #07401a;\n  font-family: var(--font-mono);\n  font-size: clamp(0.75rem, 2vw, 1rem);\n  font-weight: 700;\n  text-decoration: underline;\n  text-underline-offset: 0.3em;\n}\n\n.story-methodology {\n  padding: 1.25rem;\n  border: 1px solid var(--story-line);\n  border-radius: 0.75rem;\n  color: var(--color-fg-muted);\n  font-size: 0.75rem;\n  line-height: 1.55;\n}\n\n.story-methodology strong {\n  color: var(--color-fg);\n}\n\n.story-methodology p {\n  margin: 0.35rem 0 0;\n}\n\n@media (max-width: 47.99rem) {\n  .story-prose > header h1 {\n    font-size: clamp(2.6rem, 14vw, 4.5rem);\n  }\n\n  .story-thesis {\n    grid-template-columns: 1fr;\n    gap: 0.75rem;\n  }\n\n  .story-thesis > b {\n    width: max-content;\n    justify-self: center;\n    transform: none;\n  }\n\n  .story-thesis > b:first-of-type {\n    font-size: 0;\n    transform: none;\n  }\n\n  .story-thesis > b:first-of-type::after {\n    content: \"↓\";\n    font-size: 1.25rem;\n    line-height: 1;\n  }\n\n  .story-two-paths,\n  .story-vendor-swap,\n  .story-capacity,\n  .story-local {\n    grid-template-columns: 1fr;\n  }\n\n  .story-two-paths > span,\n  .story-vendor-swap > b,\n  .story-local-shift {\n    justify-self: center;\n    transform: rotate(90deg);\n  }\n\n  .story-capacity-transfer span {\n    transform: rotate(90deg);\n  }\n\n  .story-capacity-grid {\n    justify-content: center;\n  }\n\n  .story-capacity-core {\n    margin-inline: auto;\n  }\n\n  .story-capacity-comet {\n    display: none;\n  }\n\n  .story-capacity figcaption {\n    grid-column: auto;\n  }\n\n  .story-flywheel-orbit {\n    display: grid;\n    aspect-ratio: auto;\n    gap: 0.75rem;\n  }\n\n  .story-flywheel-glow,\n  .story-flywheel-ring,\n  .story-flywheel-comet {\n    display: none;\n  }\n\n  .story-flywheel-center,\n  .story-flywheel-node {\n    position: static;\n    width: auto;\n    min-height: 0;\n    transform: none;\n    animation: none;\n  }\n\n  .story-flywheel-center {\n    order: -1;\n    min-height: 9.5rem;\n    border-radius: 1.25rem;\n  }\n\n  .story-flywheel-node {\n    min-height: 3.75rem;\n  }\n\n  .story-growth li {\n    grid-template-columns: 4.75rem 1fr;\n    gap: 0.75rem;\n  }\n\n  .story-calculator {\n    grid-template-columns: 1fr;\n  }\n\n  .story-calculator-result {\n    align-items: flex-start;\n    width: 7.5rem;\n    text-align: left;\n  }\n\n  .story-local-network {\n    grid-template-columns: repeat(2, 1fr);\n  }\n\n  .story-cta {\n    align-items: flex-start;\n    flex-direction: column;\n  }\n}\n\n@media (max-width: 56rem) and (min-width: 48rem) {\n  .story-thesis {\n    grid-template-columns: 1fr;\n  }\n\n  .story-thesis > b {\n    width: max-content;\n    justify-self: center;\n    transform: none;\n  }\n\n  .story-thesis > b:first-of-type {\n    font-size: 0;\n    transform: none;\n  }\n\n  .story-thesis > b:first-of-type::after {\n    content: \"↓\";\n    font-size: 1.25rem;\n    line-height: 1;\n  }\n}\n\n@media (max-width: 30rem) {\n  .story-waterfall-line {\n    align-items: flex-start;\n    flex-direction: column;\n  }\n\n  .story-waterfall-operator {\n    margin-left: 0;\n  }\n\n  .story-budget-bar {\n    grid-template-columns: 1fr;\n  }\n\n  .story-local-network {\n    grid-template-columns: 1fr 1fr;\n  }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .story-flywheel-comet,\n  .story-flywheel-ring-track,\n  .story-capacity-comet,\n  .story-capacity-grid i,\n  .story-local-network i {\n    animation: none;\n  }\n\n  .story-capacity-grid i {\n    opacity: 0.55;\n  }\n\n  .story-flywheel-node-1 {\n    border-color: color-mix(in srgb, var(--story-lime) 45%, var(--story-line));\n    background: color-mix(in srgb, var(--story-lime-soft) 42%, var(--color-bg));\n    box-shadow: 0 0 0 1px color-mix(in srgb, var(--story-lime) 14%, transparent),\n      0 0.6rem 1.4rem color-mix(in srgb, #000 12%, transparent);\n  }\n\n  .story-enhanced [data-story-animate] {\n    transform: none;\n    transition: none;\n  }\n}\n\n@media print {\n  .story-article {\n    --story-green: #07401a;\n    --story-lime: #c0d900;\n    color: #000;\n  }\n\n  .story-flywheel-comet,\n  .story-local-network i {\n    animation: none;\n  }\n\n  .story-calculator input {\n    display: none;\n  }\n}\n</style><p>The startup game is no longer a lottery. You can build a <span data-ambition=\"exitLong\">$100 million</span> company with 100% certainty.</p>\n<p>That sounds almost irresponsible, but there is now a predictable model.</p>\n<p>Choose a service that companies already outsource for between $3,000 and $30,000 per month. Hire the best 5% of the people who already know how to do the work. Accelerate them with AI. Make the service twice as good or ten times faster without changing the price. Repeat that for 24 months <em>without getting distracted</em>.</p>\n<div class=\"story-thesis\" role=\"img\" aria-label=\"Twenty-four months of execution can produce eighteen million dollars in annual recurring revenue and a one hundred million dollar company at a five-point-five-times revenue multiple.\"><div><strong>24</strong><span>months</span></div><b aria-hidden=\"true\">→</b><div><strong data-ambition=\"arrCompact\">$18M</strong><span>ARR</span></div><b aria-hidden=\"true\">5.5×</b><div><strong data-ambition=\"exitCompact\">$100M</strong><span>company</span></div></div>\n<p>Startup outcomes are supposed to follow power laws. Most companies fail, a few survive, and one global category winner returns the fund. That model made sense when the game was to invent a software category and capture the world before someone else did.</p>\n<p>AI-native services change the game. You do not need to predict new demand. The demand is already there. The budget is approved. The customer already trusts an external company to perform the work.</p>\n<p>You only need to replace the company doing it.</p>\n<h2>The arithmetic is simple</h2>\n<p>Assume a company producing <span data-ambition=\"arrLong\">$18 million</span> in annual recurring revenue can be sold for 5.5 times revenue.</p>\n<p>That is a <span data-ambition=\"exitLong\">$100 million</span> company.</p>\n<p><span data-ambition=\"arrLong\">$18 million</span> ARR means <span data-ambition=\"mrrLong\">$1.5 million</span> in monthly recurring revenue.</p>\n<figure class=\"story-waterfall\" aria-labelledby=\"waterfall-caption\"><div class=\"story-waterfall-line\"><div class=\"story-ambition\"><span>I want to sell the company in 24 months for…</span><strong data-ambition=\"exitCompact\">$100M</strong><label class=\"story-ambition-control\"><span>Choose your ambition</span><input data-ambition-slider=\"true\" type=\"range\" min=\"10\" max=\"100\" step=\"5\" value=\"100\"/></label></div></div><div class=\"story-waterfall-operator\">÷ 5.5× revenue multiple</div><div class=\"story-waterfall-line\"><span>Revenue required</span><strong data-ambition=\"arrCompactLabel\">$18M ARR</strong></div><div class=\"story-waterfall-operator\">÷ 12 months</div><div class=\"story-waterfall-line story-waterfall-result\"><span>The monthly target</span><strong data-ambition=\"mrrCompactLabel\">$1.5M MRR</strong></div><figcaption id=\"waterfall-caption\">The valuation multiple is an assumption. The revenue target is arithmetic.</figcaption></figure>\n<p>There are at least two ways to get there:</p>\n<div class=\"story-two-paths\"><div><strong data-ambition=\"smbCustomers\">500</strong><p>customers paying an average of <b>$3,000/month</b></p></div><span>or</span><div><strong data-ambition=\"entCustomers\">50</strong><p>customers paying an average of <b>$30,000/month</b></p></div></div>\n<p>Those are difficult numbers. They are not crazy numbers.</p>\n<p>Agencies, consultancies, business-process outsourcers, managed service providers, accountants, recruiters, brokers, and specialized operators already charge exactly this kind of money. You are not asking a customer to create a new experimental AI budget. You are taking responsibility for an outcome they already purchase every month.</p>\n<p>Julien Bek made the opportunity painfully clear in Sequoia&#x27;s <a href=\"https://sequoiacap.com/article/services-the-new-software/\">Services: The New Software</a>: for every dollar companies spend on software, they spend six on services.</p>\n<figure class=\"story-budget\" aria-labelledby=\"budget-caption\"><div class=\"story-budget-bar\" role=\"img\" aria-label=\"One dollar spent on software for every six dollars spent on services\"><span>Software · $1</span><strong>Services · $6</strong></div><figcaption id=\"budget-caption\">Software founders have been fighting over the smaller pile.</figcaption></figure>\n<h2>Replace the vendor, not the employee</h2>\n<p>The best starting point is work that has already been outsourced.</p>\n<p>When a company outsources something, it has accepted three important facts:</p>\n<ul>\n<li>the work can happen outside the company</li>\n<li>there is already a budget for it</li>\n<li>the provider can be judged by the outcome</li>\n</ul>\n<div class=\"story-vendor-swap\"><div><span>Replacing headcount</span><strong>Reorganization</strong><small>politics · risk · a new operating model</small></div><b aria-hidden=\"true\">≠</b><div><span>Replacing a provider</span><strong>Vendor swap</strong><small>a better proposal · the same budget line</small></div></div>\n<p>Replacing an employee requires a reorganization. Replacing an outsourced provider requires a better proposal.</p>\n<p>This is why the opportunity is much more predictable than building another AI tool. <strong>A tool creates work for the customer.</strong> They still need to understand the tool, redesign the process, train the team, supervise the output, and accept responsibility when it fails.</p>\n<p>An AI-native service says: give us the work. We will make it happen.</p>\n<p>The customer does not need to understand agents, context engineering, evaluations, model routing, or MCP. They only need to see that the result is better.</p>\n<h2>The experts are already here</h2>\n<p>You also do not need to train an entire new workforce.</p>\n<p>Every service industry already has exceptional people who understand the work at a depth no foundation model can reproduce from a prompt. They know which exceptions matter, what customers forget to mention, where quality quietly collapses, and which decisions require judgment earned over years.</p>\n<p>Hire the best 5% of them.</p>\n<p>Then give each one the capacity that previously required a team.</p>\n<figure class=\"story-capacity\" aria-labelledby=\"capacity-caption\"><div class=\"story-capacity-before\"><span>Traditional service</span><div class=\"story-capacity-grid\" aria-label=\"Twenty people\"><i style=\"--i:0\"></i><i style=\"--i:1\"></i><i style=\"--i:2\"></i><i style=\"--i:3\"></i><i style=\"--i:4\"></i><i style=\"--i:5\"></i><i style=\"--i:6\"></i><i style=\"--i:7\"></i><i style=\"--i:8\"></i><i style=\"--i:9\"></i><i style=\"--i:10\"></i><i style=\"--i:11\"></i><i style=\"--i:12\"></i><i style=\"--i:13\"></i><i style=\"--i:14\"></i><i style=\"--i:15\"></i><i style=\"--i:16\"></i><i style=\"--i:17\"></i><i style=\"--i:18\"></i><i style=\"--i:19\"></i></div></div><div class=\"story-capacity-transfer\" aria-hidden=\"true\"><b>process intelligence</b><span>→</span></div><div class=\"story-capacity-after\"><span>AI-native service</span><div class=\"story-capacity-core\"><svg class=\"story-capacity-ring\" viewBox=\"0 0 100 100\" aria-hidden=\"true\"><circle class=\"story-capacity-ring-track\" cx=\"50\" cy=\"50\" r=\"40\"></circle></svg><i class=\"story-capacity-comet\" aria-hidden=\"true\"></i><div class=\"story-capacity-expert\"><strong>expert</strong><em>AI capacity</em></div></div></div><figcaption id=\"capacity-caption\">The human does not disappear. The best human becomes enormously more capable.</figcaption></figure>\n<p>The expert teaches the system how the work actually happens. The system preserves that process intelligence, executes the repeatable parts, checks its own output, escalates uncertainty, and improves every time the company delivers the service.</p>\n<p>This is the company operating system: the industry&#x27;s process intelligence uploaded into agents, tools, interfaces, approvals, and evaluation loops.</p>\n<p>One extraordinary professional with AI should be able to produce what twenty average professionals produced before, with more consistency and less waiting. The company needs drastically fewer people to serve the same revenue. That is where the margin comes from.</p>\n<figure class=\"story-flywheel\" aria-labelledby=\"flywheel-caption\"><div class=\"story-flywheel-orbit\"><div class=\"story-flywheel-glow\" aria-hidden=\"true\"></div><svg class=\"story-flywheel-ring\" viewBox=\"0 0 100 100\" aria-hidden=\"true\"><circle class=\"story-flywheel-ring-soft\" cx=\"50\" cy=\"50\" r=\"38\"></circle><circle class=\"story-flywheel-ring-track\" cx=\"50\" cy=\"50\" r=\"38\"></circle></svg><i class=\"story-flywheel-comet\" aria-hidden=\"true\"></i><div class=\"story-flywheel-node story-flywheel-node-1\"><b>01</b><span>Expert decides</span></div><div class=\"story-flywheel-node story-flywheel-node-2\"><b>02</b><span>Agents execute</span></div><div class=\"story-flywheel-node story-flywheel-node-3\"><b>03</b><span>Outcome measured</span></div><div class=\"story-flywheel-node story-flywheel-node-4\"><b>04</b><span>Process improves</span></div><div class=\"story-flywheel-center\"><strong>AI Operating System</strong><span>judgment becomes reusable</span></div></div><figcaption id=\"flywheel-caption\">Every delivery leaves the company smarter than the last one.</figcaption></figure>\n<h2>The first six months should be slow</h2>\n<p>The first six months will not look like a software rocket ship.</p>\n<p>Early on you need only a few customers: <span data-ambition=\"growthStartEnough\">8 is enough for the math</span>.</p>\n<p>At first, your experts will still perform too much of the work manually. Good. That is how you learn what deserves to become an agentic loop, where human approval is essential, which context changes the answer, and how the customer can adopt the service without reorganizing their company around your technology.</p>\n<p>Trying to automate the service before serving the customer is a form of hiding.</p>\n<p>Sell the outcome. Perform the work. Find the repetitions. Encode them. Repeat.</p>\n<p>By month six, you need:</p>\n<ol>\n<li>a service customers renew</li>\n<li>a delivery system that gets better with every new implementation</li>\n<li>a way of selling that you can repeat</li>\n</ol>\n<p>When that&#x27;s true, it&#x27;s time to change the curve and accelerate sales.</p>\n<p>Start with <span data-ambition=\"growthStartWith\">8 customers</span> and grow 3x, 3x, 2x, and 2x over the next four quarters:</p>\n<figure class=\"story-growth\" aria-labelledby=\"growth-caption\"><ol><li><div class=\"story-growth-label\"><span>Month 6</span><b data-ambition=\"growthMultiple\" data-stage=\"0\">learn</b></div><div class=\"story-growth-track\" data-ambition=\"growthBar\" data-stage=\"0\" style=\"--bar:1.6%\"><i data-story-animate=\"true\"></i><strong data-ambition=\"growthCustomers\" data-stage=\"0\">8</strong></div></li><li><div class=\"story-growth-label\"><span>Month 9</span><b data-ambition=\"growthMultiple\" data-stage=\"1\">3×</b></div><div class=\"story-growth-track\" data-ambition=\"growthBar\" data-stage=\"1\" style=\"--bar:4.8%\"><i data-story-animate=\"true\"></i><strong data-ambition=\"growthCustomers\" data-stage=\"1\">24</strong></div></li><li><div class=\"story-growth-label\"><span>Month 12</span><b data-ambition=\"growthMultiple\" data-stage=\"2\">3×</b></div><div class=\"story-growth-track\" data-ambition=\"growthBar\" data-stage=\"2\" style=\"--bar:14.399999999999999%\"><i data-story-animate=\"true\"></i><strong data-ambition=\"growthCustomers\" data-stage=\"2\">72</strong></div></li><li><div class=\"story-growth-label\"><span>Month 15</span><b data-ambition=\"growthMultiple\" data-stage=\"3\">2×</b></div><div class=\"story-growth-track\" data-ambition=\"growthBar\" data-stage=\"3\" style=\"--bar:28.799999999999997%\"><i data-story-animate=\"true\"></i><strong data-ambition=\"growthCustomers\" data-stage=\"3\">144</strong></div></li><li><div class=\"story-growth-label\"><span>Month 18</span><b data-ambition=\"growthMultiple\" data-stage=\"4\">2×</b></div><div class=\"story-growth-track\" data-ambition=\"growthBar\" data-stage=\"4\" style=\"--bar:57.599999999999994%\"><i data-story-animate=\"true\"></i><strong data-ambition=\"growthCustomers\" data-stage=\"4\">288</strong></div></li><li><div class=\"story-growth-label\"><span>Month 24</span><b data-ambition=\"growthMultiple\" data-stage=\"5\">1.74×</b></div><div class=\"story-growth-track\" data-ambition=\"growthBar\" data-stage=\"5\" style=\"--bar:100%\"><i data-story-animate=\"true\"></i><strong data-ambition=\"growthCustomers\" data-stage=\"5\">500</strong></div></li></ol><figcaption id=\"growth-caption\">The first six months build the machine. The next twelve prove distribution. The final six close the gap.</figcaption></figure>\n<p>You are now 18 months in.</p>\n<p>You have six months left to go from <span data-ambition=\"month18Customers\">288</span> customers to <span data-ambition=\"smbCustomers\">500</span>. That is <span data-ambition=\"finalGrowthPct\">74%</span> total growth across two quarters—hard, but far less violent than what you already did.</p>\n<p>At an average of $3,000 per month, <span data-ambition=\"smbCustomers\">500</span> customers put you at <span data-ambition=\"arrLong\">$18 million</span> ARR.</p>\n<p>The enterprise version follows the same logic with fewer, larger contracts. <span data-ambition=\"entCustomers\">50</span> customers at $30,000 per month produce the same result.</p>\n<section class=\"story-calculator\" aria-labelledby=\"calculator-title\" data-revenue-calculator=\"true\"><div><h3 id=\"calculator-title\">Choose your contract</h3><p>The target stays fixed at <span data-ambition=\"mrrCompact\">$1.5M</span> MRR. Move the contract value and watch the required customer count change.</p></div><label><span>Average monthly contract</span><input data-contract-value=\"true\" type=\"range\" min=\"3000\" max=\"30000\" step=\"100\" value=\"3000\"/><output data-contract-output=\"true\">$3,000</output></label><div class=\"story-calculator-result\" aria-live=\"polite\"><output data-customer-output=\"true\">500</output><span data-customer-noun=\"true\">customers</span></div></section>\n<h2>What I mean by 100% certainty</h2>\n<p>Markets remain uncertain. Customers leave. Competitors move. Teams make mistakes. A strategic buyer may refuse to pay 5.5 times revenue. Selling a private company is never literally guaranteed or liquid.</p>\n<p>The certainty comes from no longer depending on a miracle.</p>\n<p>You do not need millions of people to discover a new behavior. You do not need to invent a category, become the default product globally, or get lucky with a distribution channel before it closes.</p>\n<p>You choose an existing budget. You deliver better work. You retain the customer. You turn what your experts learn into software. You keep going for 24 months.</p>\n<div class=\"story-conditions\"><span>Existing budget</span><span>Measurable outcome</span><span>Elite domain experts</span><span>AI-native delivery</span><span>24 months without changing the game</span></div>\n<p>Every variable is close enough to touch.</p>\n<p>Most founders will still fail because keeping at anything for 24 months with this degree of focus is brutally difficult. They will change the niche, rebuild the platform, chase a new model, or try to automate judgment they have not earned.</p>\n<p>The condition is not &quot;have a good idea.&quot;</p>\n<p>The condition is to keep producing the result.</p>\n<h2>This opportunity will be local first</h2>\n<p>The last software cycle rewarded global category winners. If you started in San Francisco, studied at Harvard, or lived inside another global tastemaker network, you had an insane advantage. You could see the new behavior earlier, recruit the people naming the category, and distribute the product through the same network.</p>\n<p>That advantage continues to exist.</p>\n<p>But AI-native services do not require a global big bang.</p>\n<p>Services will remain lubricated by humans. Trust is local. Language is local. Regulation, relationships, taste, and the ugly exceptions inside a business process are local.</p>\n<figure class=\"story-local\" aria-labelledby=\"local-caption\"><div class=\"story-local-global\"><span>Software era</span><strong>one global winner</strong><i aria-hidden=\"true\"></i></div><div class=\"story-local-shift\" aria-hidden=\"true\">→</div><div class=\"story-local-network\"><div><i></i><strong data-ambition=\"exitCompact\">$100M</strong><span>Brazil</span></div><div><i></i><strong data-ambition=\"exitCompact\">$100M</strong><span>Mexico</span></div><div><i></i><strong data-ambition=\"exitCompact\">$100M</strong><span>Indonesia</span></div><div><i></i><strong data-ambition=\"exitCompact\">$100M</strong><span>Nigeria</span></div><div><i></i><strong data-ambition=\"exitCompact\">$100M</strong><span>Europe</span></div><div><i></i><strong data-ambition=\"exitCompact\">$100M</strong><span>India</span></div></div><figcaption id=\"local-caption\">The same play can be run repeatedly because the service industries already exist everywhere.</figcaption></figure>\n<p>Brazil already has accounting firms, agencies, recruiters, brokers, consultancies, and outsourcing companies collecting these budgets. So does Mexico. So does Indonesia. So does every meaningful economy in the world.</p>\n<p>Each local service industry can produce its own <span data-ambition=\"exitLong\">$100 million</span> AI-native companies, predictably and repeatedly.</p>\n<p>For the first time in a long time, a founder outside the global tastemaker regions does not need to win a worldwide software category to build something meaningful and scalable.</p>\n<p>They can start with work their neighbors already pay someone else to do.</p>\n<h2>We are making this bet</h2>\n<p>At deco, we are building this for digital experience optimization.</p>\n<p>Brands spend millions expressing themselves online and engaging their audience directly. Then those digital experiences decay. Pages become slow, campaigns wait in backlogs, conversion leaks go unnoticed, and expensive teams repeat work that software should remember.</p>\n<p>We sell an AI-native service that keeps those experiences improving on autopilot, set up and serviced by expert digital experience and e-commerce engineers.</p>\n<p>We are uploading what the best people in this industry know into a company operating system, then putting that intelligence to work for every customer.</p>\n<div class=\"story-cta\"><span>If you want to build it with us, write to</span><a href=\"mailto:builders@decocms.com\">builders@decocms.com</a></div>\n<aside class=\"story-methodology\"><strong>A note on the numbers</strong><p>This is an operating thesis, not investment guidance. The <span data-ambition=\"exitCompact\">$100M</span> valuation assumes a 5.5× revenue multiple on <span data-ambition=\"arrCompact\">$18M</span> ARR; real multiples and acquisition outcomes vary. The 1:6 software-to-services comparison comes from Sequoia Capital&#x27;s “Services: The New Software.” Every other chart visualizes the explicit assumptions in this essay.</p></aside>","layout":"story","date":"2026-07-26","status":"published","tags":["agents","ai","deco","services","startups"],"coverImage":null}</script>
