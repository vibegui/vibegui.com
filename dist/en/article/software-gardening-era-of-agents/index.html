    <script id="article-data" type="application/json">{"slug":"software-gardening-era-of-agents","locale":"en","translationKey":"article:software-gardening-era-of-agents","path":"/en/article/software-gardening-era-of-agents/","title":"Software Gardening in the Era of Agents","description":"Agents made coding cheap. Now the teams tending their software daily are burying the ones still drawing blueprints.","html":"<p>For most of my career, I thought I was doing software wrong.</p>\n<p>The senior engineers I respected showed up with architecture documents, system diagrams, months of planning before a single line was written. Conferences ran entire tracks on methodology. I absorbed the message: serious builders plan first.</p>\n<p>I hated doing that. I&#39;d ship something small, learn from it, redirect.</p>\n<p>I thought I was being undisciplined.</p>\n<p>But I was really discovering an important property of software: that it greatly resists planning and foreseeing, and greatly rewards humble iteration.</p>\n<p>Agents didn&#39;t change that insight. They made it 100x more consequential.</p>\n<h2>Planning was a hedge, not a virtue</h2>\n<p>Jeff Atwood published &quot;<a href=\"https://blog.codinghorror.com/tending-your-software-garden/\">Tending Your Software Garden</a>&quot; in 2008 — citing Andy Hunt, Dave Thomas, and a passage from 37Signals I&#39;ve thought about ever since:</p>\n<blockquote>\n<p>&quot;Software grows much in the same way that plants grow. There&#39;s flowering season. There&#39;s new feature season. There&#39;s infrastructure season. Sometimes software is working on its roots — growing underground where the public can&#39;t see it.&quot;</p>\n</blockquote>\n<p>His point: the construction metaphor — blueprints, load-bearing beams, one shot to get it right — doesn&#39;t hold. Software is soft. It&#39;s alive. The best projects feel alive: constantly growing, shaped by whatever conditions they encounter.</p>\n<p>He was right. But in 2008, even the largest teams still worked at the pace of human hands. You shipped. You waited. Problems surfaced when users ran into them.</p>\n<p>The reason planning <em>felt</em> rational wasn&#39;t wisdom. It was that coding was expensive. Redoing things cost months. Over-planning was a hedge — a rational defense against the cost of being wrong.</p>\n<p>Agents dissolved that cost.</p>\n<h2>Karpathy named it vibecoding in 2025</h2>\n<p>In February 2025, Andrej Karpathy posted on X:</p>\n<blockquote>\n<p>&quot;There&#39;s a new kind of coding I call &#39;vibe coding&#39;, where you forget that the code even exists. It&#39;s not really coding — I just see stuff, say stuff, run stuff, and copy-paste stuff, and it mostly works.&quot;</p>\n</blockquote>\n<p>Then, a year later:</p>\n<blockquote>\n<p>&quot;Something flipped where I went from 80-20 writing code versus delegating to agents — to 20-80.&quot;</p>\n</blockquote>\n<p>And then the real insight:</p>\n<blockquote>\n<p>&quot;Now the bottleneck is you.&quot;</p>\n</blockquote>\n<p>When building gets cheap, the cost that justified planning disappears — and something else comes into view. The bottleneck was never writing code. <strong>It was always knowing what to build.</strong> What your users actually need. What&#39;s failing that you haven&#39;t noticed yet. What problem you&#39;re solving that actually matters.</p>\n<p>Agents made this undeniable.</p>\n<h2>The real constraint is domain knowledge</h2>\n<p>Claude Code flipped the interaction model: developers went from writing code to directing it. Karpathy&#39;s 80-20 flip became the norm for millions of developers in less than a year.</p>\n<p>Then Charlie Holtz and Jackson de Campos built <a href=\"https://www.conductor.build/blog/series-a\">Conductor</a> — $22M Series A, March 2026 — and took the next step: isolated copies of your codebase, dozens of agents running in parallel across each one, review and merge their work. Not one developer walking the rows. Twenty agents, each working their own section.</p>\n<p>Faster. Yes. But faster <em>at what?</em></p>\n<p>Here&#39;s what I&#39;ve learned running agents inside live storefronts and production codebases: the quality of what agents produce is entirely proportional to the domain context they carry. Give an agent a generic prompt, it does generic work. Give it the specifics — what your users complain about, how your catalog is actually structured, what failed last quarter and why — and it starts doing work no external consultant ever could.</p>\n<p>Sequoia recently argued that <a href=\"https://sequoiacap.com/article/services-the-new-software/\">the next wave of billion-dollar companies</a> will look like service firms on the outside but run like software companies on the inside. Don&#39;t sell the shovel — sell the harvest. You build domain context so deep that your agents can tend someone else&#39;s garden better than they can tend it themselves.</p>\n<p>The compounding isn&#39;t in the velocity. It&#39;s in the knowledge you encode into each agent over time.</p>\n<h2>The point of speed is learning</h2>\n<p>Faster cycles compress the distance between what you build and what you learn.</p>\n<p>The teams winning now aren&#39;t the ones with the most agents. They&#39;re the ones who figured out how to orchestrate agents with the right tools and context — and used the speed to discover what their users actually need, faster than anyone else could.</p>\n<p>If you&#39;ve been building iteratively and felt like you were cutting corners — you weren&#39;t. You were learning. That was always the game. Agents just collapsed the timeline.</p>\n<p>The construction metaphor promised certainty. The garden metaphor demands something harder: staying close enough to what&#39;s growing to know when to prune, when to water, and when to let something die.</p>\n<p>Agents accelerated everything. Except the fundamentals. You still plant, tend, learn, and adapt. The more things change, the more the garden demands the same thing it always did.</p>\n","layout":"prose","date":"2026-04-08","status":"published","tags":["agents","ai","mcp","product","startup"],"coverImage":"/images/articles/software-gardening-era-of-agents.png"}</script>
