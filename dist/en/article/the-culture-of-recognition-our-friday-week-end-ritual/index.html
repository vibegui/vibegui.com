    <script id="article-data" type="application/json">{"slug":"the-culture-of-recognition-our-friday-week-end-ritual","locale":"en","translationKey":"linkedin:7341940138718994433","path":"/en/article/the-culture-of-recognition-our-friday-week-end-ritual/","alternatePath":"/article/a-cultura-do-reconhecimento-como-construimos-resultados-extraordinarios-na-deco-cx/","title":"The Culture of Recognition: Our Friday Week End Ritual","description":"Why explicit recognition matters, and the meeting structure that makes extraordinary results possible.","html":"<p>Another wonderful week comes to an end, and at deco we always have the Week End meeting from 4:30 to 6:00 PM on Friday. It&#39;s, without a doubt, my favorite moment of the week. The structure is:</p>\n<p>First, we have <strong>Announcements</strong>.</p>\n<blockquote>\n<p>5 minutes — What is relevant for everyone in the company to know?</p>\n</blockquote>\n<p>Then, we go to <strong>Conversation Cleanup</strong>.</p>\n<blockquote>\n<p>15 minutes — This week, what did you discover was taking away your power in the company? What realization did you have to regain high performance and be complete with us? What breakthrough would you like to share that can help others in the company?</p>\n</blockquote>\n<p>Then, we talk about <strong>Milestones</strong>, focusing on Results and Learnings.</p>\n<blockquote>\n<p>60 minutes — Time to share what went right (our highlights/results), what went wrong (our learnings), and let&#39;s showcase our improvements towards our commitments (DEMO TIME!)</p>\n</blockquote>\n<p>Finally, comes the MOST IMPORTANT part! <strong>Recognition and Thanks</strong>.</p>\n<blockquote>\n<p>10 minutes — Recognize or thank your peers for something you admired.</p>\n</blockquote>\n<p>This is where you really see how the company is vibrating. This was a week with a holiday in the middle, part of the team OOO, and even so there was a ton of progress and the typical flood of recognition.</p>\n<p><strong>Recognition is not automatic, it&#39;s not natural.</strong> There has to be explicit space for people to recognize each other&#39;s good work and demonstrate their appreciation. That&#39;s why we practice every week. It&#39;s simple, but it makes all the difference.</p>\n<p>A company&#39;s results are important. But for me, <strong>the way you build the company is just as important.</strong> We&#39;ve distinguished a way of working that I&#39;m very proud of. And that way will deliver extraordinary results. After all, they&#39;re extraordinary people committed to an extraordinary future.</p>\n<p>deco team, I want to recognize our resilience and our TRANSFORMATION over the last three months. You make me so proud—every week I&#39;m certain I&#39;m in the right room!!!</p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_mais-uma-semana-maravilhosa-chega-ao-fim-activity-7341940138718994433-tqwA\">LinkedIn</a> on June 20, 2025.</em></p>\n","layout":"prose","date":"2025-06-20","status":"published","tags":["culture","leadership","linkedin-import","rituals"],"coverImage":null}</script>
