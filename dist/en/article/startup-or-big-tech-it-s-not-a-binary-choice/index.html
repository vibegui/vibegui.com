    <script id="article-data" type="application/json">{"slug":"startup-or-big-tech-it-s-not-a-binary-choice","locale":"en","translationKey":"linkedin:7264771955550015488","path":"/en/article/startup-or-big-tech-it-s-not-a-binary-choice","title":"Startup or Big Tech? It's Not a Binary Choice","description":"Three questions to help you navigate the spectrum between chaos and stability.","html":"<p>Should I work at a Startup or Big Tech?</p>\n<p>Actually, it&#39;s not a binary choice. It&#39;s a spectrum. And it depends on some factors:</p>\n<ul>\n<li><p>Are you willing to accept the risk that your work never materializes and you have to start over? Or you want to be sure that you will progress, year in, year out?</p>\n</li>\n<li><p>Are you willing to commit the majority of your time and prioritize work over other life aspects? (Specifically because you really love the CRAFT of your work and the FUTURE you are building.) Or do you think that people who work on holidays are total idiots?</p>\n</li>\n<li><p>Do you prefer to decide for yourself on what to work, how fast, how often to ship? Or do you prefer someone managing your workload and giving you the right amount of tasks and ensuring you&#39;re not going to burnout, and that your career is progressing?</p>\n</li>\n</ul>\n<p>None of those are loaded questions, and I half-jokingly came up with them during this half an hour I was recording this video. Everyone is different and there are many subtleties for where to work and when. Don&#39;t take this seriously.</p>\n<p><strong>Just make sure you&#39;re having a lot of fun, because life is short and absolutely unpredictable</strong> 👋</p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_should-i-work-at-a-startup-or-big-tech-actually-activity-7264771955550015488-R8Qj\">LinkedIn</a> on November 19, 2024.</em></p>\n","layout":"prose","date":"2024-11-19","status":"published","tags":["advice","career","linkedin-import","startup"],"coverI
