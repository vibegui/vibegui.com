    <script id="article-data" type="application/json">{"slug":"the-pleasure-of-playing-the-most-important-game-of-your-life-whi","locale":"en","translationKey":"linkedin:7261714591074713600","path":"/en/article/the-pleasure-of-playing-the-most-important-game-of-your-life-whi/","alternatePath":"/article/o-prazer-de-estar-perdendo-a-busca-por-jogos-extraordinarios/","title":"The Pleasure of Choosing the Hardest Game You Can Find","description":"Why deliberately picking games where extraordinary things must happen to win is the most alive you can feel.","html":"<p>Call me a masochist, but for me the most delicious thing in life is choosing to play the hardest game you can find—and committing fully to it. This feeling of obsessive searching for which moves are essential RIGHT NOW, simultaneously generates stress, and simultaneously is the greatest possible connection with the sensation of being ALIVE.</p>\n<p>What makes a game hard? Any game where extraordinary things must happen for you to win. Brazil as a protagonist in technology—extraordinary things must happen. Building the platform that democratizes AI software creation—extraordinary things must happen. I only want to play games where, to win, a lot of things that aren&#39;t predictable need to go right.</p>\n<p>Those who play safe games—who have time to stop and do an MBA at a fancy school, who have time to travel 10 times a year, who have time to stress about soccer and entertainment—they may be having a very fun life. But I&#39;m sure they don&#39;t know THIS feeling, which, honestly, I wouldn&#39;t trade for anything. I want to die as an old man, still playing the hardest game I can find.</p>\n<p>The choice isn&#39;t about being behind. It&#39;s about refusing to play games you already know how to win.</p>\n<p><em>PS: The quality of life for those who choose hard games is absolutely detestable, make no mistake. You live anxious, sleep poorly, have difficult conversations with your team constantly. It&#39;s uncomfortable to commit to a game where extraordinary outcomes are required. The point isn&#39;t to maximize your comfort. If you want that, limit yourself to games you know you can win.</em></p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_me-chamem-de-masoquista-mas-pra-mim-a-coisa-activity-7261714591074713600-0hoJ\">LinkedIn</a> on November 11, 2024.</em></p>\n","layout":"prose","date":"2024-11-11","status":"published","tags":["linkedin-import","mindset","motivation","startup"],"coverImage":null}</script>
