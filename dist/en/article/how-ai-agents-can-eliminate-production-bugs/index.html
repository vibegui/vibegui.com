    <!-- Embedded article data (after root so DOM is ready when React reads it) -->
    <script id="article-data" type="application/json">{"slug":"how-ai-agents-can-eliminate-production-bugs","locale":"en","translationKey":"linkedin:7371884584998727680","path":"/en/article/how-ai-agents-can-eliminate-production-bugs/","alternatePath":"/article/a-evolucao-da-plataforma-como-agentes-de-ia-podem-eliminar-erros-em-producao/","title":"How AI Agents Can Eliminate Production Bugs","description":"From manually fixing customer errors with Claude Code and Cursor to building MCPs that let agents debug in real-time.","html":"<p>Normally, a startup writes product code that customers use directly. deco, however, is a platform. That means we write the &quot;base&quot; code, on top of which our customers write their code.</p>\n<p>Anyone who&#39;s operated a platform knows that running user code is an immense challenge—you don&#39;t control what goes into production.</p>\n<p>About two months ago, when declaring deco&#39;s future at deco.day, we had a powerful distinction: <strong>we can&#39;t announce a platform evolution for AI workflows and agents while our production customers are suffering from errors.</strong></p>\n<p>Whether the errors are in their code, written by them or by an agency: it doesn&#39;t matter. Our responsibility is to build infrastructure and tooling that PREVENTS our users from putting errors into production.</p>\n<p>So I did what any obsessive founder would do and started <em>manually</em> fixing the &quot;top errors&quot; from our dashboard (which is an integrated deco feature, of course—every site has complete error logs accessible to users). I also had help from geniuses on the team, especially the hero Guilherme Tavano, who deeply understands the nuances of our framework.</p>\n<p>Manually means:</p>\n<ul>\n<li>Find a high-frequency error</li>\n<li>Copy the stack trace</li>\n<li>Get the store name</li>\n<li>Clone the repository from our centralized GitHub (we host all our clients&#39; code privately, which allows us to collaborate with them much more easily)</li>\n<li>Run locally and reproduce the error</li>\n<li>Have Claude Code or Cursor (I experimented a lot between them, I&#39;m especially happy with Cursor+GPT-5) look at the code and stack trace and propose a fix</li>\n<li>60% of the time it found the problem one-shot</li>\n<li>30% of the time it was just updating a deco dependency</li>\n<li>10% of the time I had to stop and think and give better context, eventually adding our relevant docs</li>\n</ul>\n<p>But I wasn&#39;t doing this (just) to pay for my sins (remembering that the errors are in our customer&#39;s code). I did this to progressively automate the pieces necessary for <strong>AI AGENTS to do this for me</strong>, and for my clients and partners, forever.</p>\n<p>Beyond the tactical result from our 28-day dashboard, we created the MCPs for the logging system that allows deco agents to look at errors in real-time and propose code changes.</p>\n<p>If you want to see a demo of an agent seeing the log, solving the error, and pushing the fix, I left the link to Tavano&#39;s demo in the comments.</p>\n<p><strong>You have no idea the quality leap that humanity&#39;s code will undergo in the next 2 years.</strong> Buggy software will be something we&#39;ll tell stories about with nostalgia. Remember when we woke up in the morning with a production bug because someone pushed wrong code? LOL</p>\n<p>Good times!</p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_normalmente-uma-startup-escreve-o-c%C3%B3digo-activity-7371884584998727680-qNPb\">LinkedIn</a> on September 11, 2025.</em></p>\n","layout":"prose","date":"2025-09-11","status":"published","tags":["agents","ai","debugging","linkedin-import","mcp"],"coverImage":null}</script>
