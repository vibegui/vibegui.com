    <!-- Embedded article data (after root so DOM is ready when React reads it) -->
    <script id="article-data" type="application/json">{"slug":"protagonists-of-the-future-challenging-victimism-and-building-pr","locale":"en","translationKey":"linkedin:7360468284829265920","path":"/en/article/protagonists-of-the-future-challenging-victimism-and-building-pr/","alternatePath":"/article/protagonistas-do-futuro-desafiando-o-vitimismo-e-construindo-a-prosperidade/","title":"Protagonists of the Future: Challenging Victimism and Building Prosperity","description":"The past doesn't determine the future. The future is made now. Let's be protagonists of the world's prosperity.","html":"<p>I have a friend who insists on saying that &quot;the system is wrong,&quot; that the world is getting worse, that nothing has a solution... I don&#39;t know what world my friend lives in, but here on planet Earth, capitalism, science, technology, and democracy have been generating unprecedented prosperity. Just look at the data on infant mortality, access to education, poverty, and life expectancy.</p>\n<p>Do you also have friends who love to complain about everything but don&#39;t do anything pragmatic to improve the world? And you, do you also think the system is wrong, that we are oppressed, victims of a conspiratorial capitalist elite? Or have you already figured out that you are responsible for your destiny and the destiny of our country?</p>\n<p>Before you confuse me for an anarcho-liberal neo-patriot, let me be clear: I want a strong State that punishes greedy companies and invests in the country. I want assistance for the poor. I want a universal health and education system. But that&#39;s where my alliance with the left ends: the rest of the victimism and the paranoid persecution complex that everything is a conspiracy of the rich against the poor, I refuse to entertain.</p>\n<p>I wish I had distinguished the following earlier: &quot;money&quot; is not the problem. Who controls the money <em>currently</em> is the problem. But that is perfectly solvable. You just have to make more money, faster, than them.</p>\n<p>We can change the priorities of our society. We can finance a rebellious and prosperous country. But only if our youth (and especially our educated youth, our <em>intellectual elite</em>) believes that they are protagonists of the future, not victims of the past.</p>\n<p><strong>The past doesn&#39;t determine the future. The future is made now. Let&#39;s be protagonists of the world&#39;s prosperity!</strong></p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_eu-tenho-um-amigo-que-insiste-em-dizer-que-activity-7360468284829265920-b0m9\">LinkedIn</a> on August 9, 2025.</em></p>\n","layout":"prose","date":"2025-08-11","status":"published","tags":["brazil","leadership","linkedin-import","mindset"],"coverImage":null}</script>
