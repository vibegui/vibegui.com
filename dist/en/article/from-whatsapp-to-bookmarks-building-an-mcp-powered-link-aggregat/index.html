    <script id="article-data" type="application/json">{"slug":"from-whatsapp-to-bookmarks-building-an-mcp-powered-link-aggregat","locale":"en","translationKey":"article:from-whatsapp-to-bookmarks-building-an-mcp-powered-link-aggregat","path":"/en/article/from-whatsapp-to-bookmarks-building-an-mcp-powered-link-aggregat/","title":"From WhatsApp to Bookmarks: Building an MCP-Powered Link Aggregator","description":"Building a link aggregation system with AI enrichment — from WhatsApp scraping to SQLite databases to a searchable dashboard.","html":"<p>For the past 6 months, two WhatsApp groups at my company have been my primary source of interesting links. We have a general team chat and a developer-focused group where people regularly drop tools, articles, and GitHub repos worth checking out. The problem is that WhatsApp is terrible for this. Links disappear into endless scrolling. There&#39;s no search. No categorization. No way to revisit that article someone shared in March.</p>\n<p>I took this as an opportunity to build something around our new <a href=\"https://github.com/deco-cx/mesh\">MCP mesh</a> — a personal link aggregation system with AI enrichment.</p>\n<h2>Extracting Links from WhatsApp</h2>\n<p>WhatsApp Web doesn&#39;t have an API. It really doesn&#39;t want you to export data programmatically. But it&#39;s just a web page with a DOM.</p>\n<p>I built a Chrome extension that:</p>\n<ol>\n<li>Injects into WhatsApp Web</li>\n<li>Auto-scrolls through conversation history to load older messages</li>\n<li>Extracts all URLs from message text</li>\n</ol>\n<p>I ran this manually on both our company groups — the general chat and the dev channel — and pulled out about 500 unique links. The extension dumps everything to a text file which I then processed into CSV.</p>\n<p>The next step is wiring this up so agents can trigger scrapes directly via MCP. That&#39;s for another post.</p>\n<h2>The CSV Phase (and Why It Failed)</h2>\n<p>My first approach was straightforward: parse the extracted links into a CSV file. Title, URL, maybe some tags. Easy to edit, version-controlled, done.</p>\n<p>This lasted about 2 hours.</p>\n<p>The problems started piling up:</p>\n<ul>\n<li>Parsing CSV reliably is surprisingly annoying (quotes inside fields, commas in URLs, newlines in descriptions)</li>\n<li>LLMs really struggle with CSV — they hallucinate column alignment, miss rows, duplicate entries</li>\n<li>No structured queries — filtering by tag meant grep or loading everything into a script</li>\n<li>Concurrent edits from different MCP tools caused merge conflicts</li>\n</ul>\n<p>I was spending more time debugging CSV parsing than actually curating links. Time for something structured.</p>\n<h2>The SQLite Migration</h2>\n<p>SQLite turned out to be exactly what I needed. Single file, no server, git-friendly, and LLMs handle SQL without the weird edge cases.</p>\n<pre><code class=\"language-sql\">CREATE TABLE bookmarks (\n  id INTEGER PRIMARY KEY,\n  url TEXT UNIQUE NOT NULL,\n  title TEXT,\n  description TEXT,\n  research_raw TEXT,\n  exa_content TEXT,\n  stars INTEGER,\n  language TEXT,\n  icon TEXT,\n  insight_dev TEXT,\n  insight_founder TEXT,\n  insight_investor TEXT,\n  classified_at TEXT,\n  created_at TEXT,\n  updated_at TEXT\n);\n</code></pre>\n<p>Once I had bookmarks in SQLite, I looked at my blog content — articles, drafts — still sitting in markdown files with YAML frontmatter. Same problems: hard to query, awkward for MCP tools, no structured updates. So I migrated those too. Now everything lives in <code>data/bookmarks.db</code> and <code>data/content.db</code>.</p>\n<h2>Browser Bookmarks</h2>\n<p>I also had years of curated folders in my browser: &quot;Refs&quot;, &quot;Must Read&quot;, &quot;Watchlist&quot;, &quot;Readlist&quot;. These needed to go into the same database.</p>\n<p>Every browser stores bookmarks differently, which is annoying:</p>\n<ul>\n<li><strong>Chrome/Brave/Edge</strong> — JSON file with Windows timestamps (microseconds since 1601, because why not)</li>\n<li><strong>Safari</strong> — Binary plist</li>\n<li><strong>Firefox</strong> — SQLite database with its own schema</li>\n</ul>\n<p>I wrote readers for each format and exposed them as MCP tools:</p>\n<table>\n<thead>\n<tr>\n<th>Tool</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>BOOKMARKS_DISCOVER_BROWSERS</code></td>\n<td>Find all browser profiles on the system</td>\n</tr>\n<tr>\n<td><code>BOOKMARKS_READ</code></td>\n<td>Read bookmarks from a specific browser</td>\n</tr>\n<tr>\n<td><code>BOOKMARKS_SEARCH</code></td>\n<td>Search across all browsers by URL or title</td>\n</tr>\n<tr>\n<td><code>BOOKMARKS_EXPORT_CSV</code></td>\n<td>Export to CSV format</td>\n</tr>\n</tbody></table>\n<p>The discover tool returns something like:</p>\n<pre><code class=\"language-json\">{\n  &quot;profiles&quot;: [\n    { &quot;browser&quot;: &quot;chrome&quot;, &quot;name&quot;: &quot;Default&quot;, &quot;path&quot;: &quot;...&quot; },\n    { &quot;browser&quot;: &quot;brave&quot;, &quot;name&quot;: &quot;Profile 1&quot;, &quot;path&quot;: &quot;...&quot; },\n    { &quot;browser&quot;: &quot;comet&quot;, &quot;name&quot;: &quot;Default&quot;, &quot;path&quot;: &quot;...&quot; }\n  ]\n}\n</code></pre>\n<p>From there I can read specific profiles or search across all of them. I merged everything into the main database — another 100+ links from my browser curation.</p>\n<h2>AI Enrichment</h2>\n<p>At this point I had 400+ links, but most were just URLs with maybe a title scraped from the page. I wanted a way to quickly find which links are actually interesting, which ones relate to topics I care about (MCP, AI agents, TypeScript tooling), and which ones I can safely ignore.</p>\n<p>Manual curation doesn&#39;t scale. So I built an enrichment pipeline that runs through each link:</p>\n<pre><code>Perplexity → Exa → Claude Sonnet\n(research)   (content)   (classification)\n</code></pre>\n<p><strong>Step 1: Research.</strong> Ask Perplexity what this URL is about — purpose, features, target audience. This gives context even for pages that are hard to scrape.</p>\n<p><strong>Step 2: Content.</strong> Use Exa to fetch the actual page content. Some pages block scrapers, but Exa usually gets through.</p>\n<p><strong>Step 3: Classification.</strong> Send both research and content to Claude Sonnet with a prompt asking for:</p>\n<ul>\n<li>Star rating (1-5)</li>\n<li>Improved title and description</li>\n<li>Tags by tech stack, type, and audience</li>\n<li>Three insights: one for developers, one for founders, one for investors</li>\n</ul>\n<p>The rating prompt is important. I tell Claude to be harsh — most resources should be 2-3 stars. Only genuinely excellent content gets 4-5. This prevents the &quot;everything is great&quot; problem where ratings become meaningless.</p>\n<p>The three insights let me browse the collection from different angles. Sometimes I want to know what&#39;s technically interesting. Sometimes I want to know what&#39;s relevant for the business.</p>\n<h2>The Build Pipeline</h2>\n<p>For deployment, the database needs to become something the frontend can consume. Currently I export to JSON at build time:</p>\n<pre><code class=\"language-typescript\">const rows = db.prepare(&quot;SELECT * FROM bookmarks&quot;).all();\nwriteFileSync(&quot;public/bookmarks/data.json&quot;, JSON.stringify(rows));\n</code></pre>\n<p>The build runs on Cloudflare Pages using Node 22&#39;s native <code>node:sqlite</code>. No npm install needed — the database is in git, the export script reads it directly.</p>\n<h3>What&#39;s Not Great</h3>\n<p>This works, but the JSON file is getting large. 400 bookmarks with full enrichment data adds up. Loading it all upfront on page load isn&#39;t ideal, especially as the collection grows.</p>\n<p>The next iteration will use <a href=\"https://github.com/nickreese/sql.js-httpvfs\">sql.js-httpvfs</a> to serve the SQLite database directly from R2. The frontend would make actual SQL queries over HTTP range requests — pagination, filtering, search, all without loading a giant JSON blob. That&#39;s on the roadmap.</p>\n<h2>The WAL Gotcha</h2>\n<p>One thing that bit me: SQLite&#39;s Write-Ahead Logging. Writes go to a <code>.wal</code> file first, then get merged into the main <code>.db</code> during checkpoints. The WAL files are gitignored (they&#39;re ephemeral), so if you commit without checkpointing, your changes sit in the WAL and never make it to the repo.</p>\n<p>I lost data to this twice before adding a pre-commit hook:</p>\n<pre><code class=\"language-yaml\"># lefthook.yml\n5_checkpoint_db:\n  run: |\n    sqlite3 data/bookmarks.db &quot;PRAGMA wal_checkpoint(TRUNCATE);&quot;\n    sqlite3 data/content.db &quot;PRAGMA wal_checkpoint(TRUNCATE);&quot;\n</code></pre>\n<p>Now all writes get merged into the main database before every commit.</p>\n<h2>The Dashboard</h2>\n<p>The final piece is a React page at <code>/bookmarks</code> with filtering:</p>\n<ul>\n<li><strong>By persona</strong>: Developer, Founder, Investor</li>\n<li><strong>By tech stack</strong>: TypeScript, React, AI, MCP, etc.</li>\n<li><strong>By type</strong>: Tool, Article, Video, Repo</li>\n<li><strong>By platform</strong>: GitHub, LinkedIn, Twitter, YouTube</li>\n<li><strong>By rating</strong>: Minimum stars</li>\n</ul>\n<p>Each bookmark shows an icon, title, description, star rating, and buttons to view the AI-generated insights. Clicking the stars opens the developer insight. The other insights are accessible via buttons.</p>\n<h2>Current Numbers</h2>\n<table>\n<thead>\n<tr>\n<th>Metric</th>\n<th>Value</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Links from WhatsApp</td>\n<td>~500</td>\n</tr>\n<tr>\n<td>Links from browsers</td>\n<td>~100</td>\n</tr>\n<tr>\n<td>After deduplication</td>\n<td>400</td>\n</tr>\n<tr>\n<td>AI-enriched</td>\n<td>42</td>\n</tr>\n<tr>\n<td>Build time</td>\n<td>~3 seconds</td>\n</tr>\n</tbody></table>\n<h2>What&#39;s Next</h2>\n<ul>\n<li><strong>sql.js-httpvfs</strong> for direct database queries from the browser</li>\n<li><strong>MCP control</strong> for the WhatsApp extension so agents can trigger scrapes</li>\n<li><strong>Periodic sync</strong> from browsers and chat groups</li>\n<li><strong>RSS feed</strong> of new links</li>\n</ul>\n<p>The code is at <a href=\"https://github.com/deco-cx/vibegui.com\">github.com/deco-cx/vibegui.com</a> and the dashboard is live at <a href=\"/bookmarks\">vibegui.com/bookmarks</a>.</p>\n<hr>\n<p><em>Built with Claude Opus 4.5 via MCP.</em></p>\n","layout":"prose","date":"2025-12-27","status":"published","tags":["agentic-workflows","bookmarks","chrome-extension","mcp","whatsapp"],"coverImage":null}</script>
