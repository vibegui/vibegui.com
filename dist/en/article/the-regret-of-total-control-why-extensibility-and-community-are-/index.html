    <!-- Embedded article data (after root so DOM is ready when React reads it) -->
    <script id="article-data" type="application/json">{"slug":"the-regret-of-total-control-why-extensibility-and-community-are-","locale":"en","translationKey":"linkedin:7261153092614705153","path":"/en/article/the-regret-of-total-control-why-extensibility-and-community-are-/","alternatePath":"/article/o-arrependimento-do-controle-total-por-que-extensibilidade-e-comunidade-sao-prioridade-zero/","title":"The Regret of Total Control: Why Extensibility and Community Are Priority Zero","description":"A founder''s hard-learned lesson about open-source, platform thinking, and the hidden cost of keeping control.","html":"<p>If there&#39;s one thing I BITTERLY regret (not) doing at deco.cx, it was not starting open-source from the beginning. I kept deferring the focus on extensibility by the community because &quot;the product wasn&#39;t ready&quot; or &quot;we still had to focus on customers and prove value&quot; or... etc.</p>\n<p>There was always a reason not to stop and focus on BEING EXTENSIBLE as a priority, as a reason for being. But the truth is that the reason was a hidden profit: &quot;we get to maintain total control.&quot; This is an addiction of product makers, from designers to engineers, that has to do with the arrogant distrust that &quot;users can only make our art worse.&quot; Predictable result: the product only evolves at the speed of our team. No matter how good the team is, it&#39;s an unviable speed to dominate the world.</p>\n<p>A platform can only maximize its value from the moment it establishes a positive feedback loop: the more people extending my platform, the better my platform becomes for everyone. It&#39;s the famous network effect: the more users participating, the better the network becomes for everyone. That&#39;s why when you join LinkedIn it asks for your contacts: to connect you with people you know (retention) and help you invite those who haven&#39;t come yet (attraction).</p>\n<p>Today, this is the most important conversation at Webdraw. We&#39;re evolving by leaps and bounds and having heated discussions and daily breakthroughs. But if there&#39;s one thing I won&#39;t give up, that it&#39;s absolutely unviable for us to get wrong again, it&#39;s this: <strong>extensibility and community protagonism is PRIORITY ZERO.</strong> We will be as giant as we can get people to create Webdraw TOGETHER with us. And when that happens, there won&#39;t be a GitHub Spark, there won&#39;t be an Adobe, there won&#39;t be a Figma that can stop us.</p>\n<p>You think Draw is just drawing? Draw is also what attracts and leads. &quot;Webdraw&quot; is the new gravitational center of digitalization, pulling everything to the web and helping you extract the maximum from the web. A new paradigm to create and consume the web, at the insane speed of artificial intelligence.</p>\n<p>And it was born in Brazil, made by Cariocas, Paraibanos, Paulistas... But never by &quot;stray dogs.&quot; No stray dogs on the team, except for Moela, Jose Miguel&#39;s actual dog.</p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_se-tem-uma-coisa-que-eu-me-arrependo-amargamente-activity-7261153092614705153-e2Gf\">LinkedIn</a> on November 10, 2024.</em></p>\n","layout":"prose","date":"2024-11-10","status":"published","tags":["linkedin-import","open-source","platform","startup"],"coverImage":null}</script>
