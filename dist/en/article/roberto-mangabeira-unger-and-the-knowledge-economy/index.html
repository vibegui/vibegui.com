    <script id="article-data" type="application/json">{"slug":"roberto-mangabeira-unger-and-the-knowledge-economy","locale":"en","translationKey":"linkedin:7371129068819406848","path":"/en/article/roberto-mangabeira-unger-and-the-knowledge-economy/","alternatePath":"/article/roberto-mangabeira-unger-e-a-economia-do-conhecimento-um-futuro-poderoso-e-improvavel/","title":"Roberto Mangabeira Unger and the Knowledge Economy","description":"Meeting the professor whose ideas are as powerful as they are improbable—and why they matter now more than ever.","html":"<p>Yesterday I had the privilege of interviewing Professor Roberto Mangabeira Unger. Those who know me know that since my VTEX days, I had the dream of bringing him to an event. And it happened—at deco.day?</p>\n<p>The professor&#39;s ideas are revolutionary. He is a man truly ahead of his time. This means he already inhabits a future that, for most of us, is as powerful as it is improbable.</p>\n<p>This causes him to be misunderstood—and even rejected—by both the left and the right. It&#39;s obvious: his ideas don&#39;t fit this antiquated dichotomy!</p>\n<p>We need to listen to the professor to have the AUDACITY to build a country that doesn&#39;t ask permission, that doesn&#39;t wait for the developmental formula from gringos to copy.</p>\n<p><strong>This is the century of the Global South.</strong> We will invent new productive and economic mechanisms capable of lifting up the Brazilian masses, inviting them to the new productive vanguard of the world: the knowledge economy.</p>\n<p>Read this book. Then you&#39;ll have another perspective on why we are building a company based on COMMUNITY and ECOSYSTEM.</p>\n<p><em>A rising tide lifts all boats.</em></p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_ontem-tive-o-privil%C3%A9gio-de-entrevistar-o-activity-7371129068819406848-i8oA\">LinkedIn</a> on September 9, 2025.</em></p>\n","layout":"prose","date":"2025-09-09","status":"published","tags":["brazil","economics","linkedin-import","philosophy"],"coverImage":null}</script>
