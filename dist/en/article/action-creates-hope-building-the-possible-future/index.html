    <script id="article-data" type="application/json">{"slug":"action-creates-hope-building-the-possible-future","locale":"en","translationKey":"linkedin:7392164862484787200","path":"/en/article/action-creates-hope-building-the-possible-future","alternatePath":"/article/acao-gera-esperanca-construindo-o-futuro-possivel","title":"Action Creates Hope: Building the Possible Future","description":"Why pessimism is a self-fulfilling prison, and how taking action—regardless of motivation—generates the hope we need.","html":"<p>It deeply irritates and saddens me that most people live their lives from: &quot;Let me show you what happened in the past, and explain how everything is going to go wrong and stay bad.&quot;</p>\n<p>It&#39;s unbelievable that they don&#39;t realize that, by doing so, they create their own prison. Mangabeira already taught us: action is not the consequence of hope—it GENERATES hope. It doesn&#39;t matter the motivation for the action—it can be anger, envy, remorse, greed, or altruism. What matters is ACTING.</p>\n<p>I prefer to live life from: &quot;Let me show you the future that is possible, and show you why it&#39;s worth working to build that future, even given the current conditions of the game.&quot;</p>\n<p>Singapore was a backwater just yesterday. China had the same GDP as Brazil 80 years ago. But Brazil has no hope?</p>\n<p>STOP EXPLAINING WHY BRAZIL IS GOING TO FAIL WHILE PAYING TAXES IN DOLLARS/EUROS/POUNDS. COME BACK TO YOUR COUNTRY AND WORK TO MAKE IT SUCCEED! Damn!</p>\n<p>Good morning.</p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_me-irrita-e-entristece-profundamente-que-activity-7392164862484787200-3d63\">LinkedIn</a> on November 6, 2025.</em></p>\n","layout":"prose","date":"2025-11-06","status":"published","tags":["action","brazil","linkedin-import","mindset"],"coverImage":null}</script>
