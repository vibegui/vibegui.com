    <script id="article-data" type="application/json">{"slug":"the-great-ssg-simplification-killing-json-fetches-one-page-at-a-","locale":"en","translationKey":"article:the-great-ssg-simplification-killing-json-fetches-one-page-at-a-","path":"/en/article/the-great-ssg-simplification-killing-json-fetches-one-page-at-a-/","title":"SEO-First SSG: From Social Embeds to Zero-Fetch Pages","description":"How adding proper SEO meta tags led me to embed everything — articles, context pages, and the manifest — directly into static HTML. The journey from broken social previews to sub-15-second deploys.","html":"<p>It started with a LinkedIn preview.</p>\n<p>I shared a blog post and got... nothing. No image, no description, just a bare URL. The kind of link people scroll past without a second thought.</p>\n<p>Five hours later, I&#39;d rebuilt how this entire blog generates and serves content.</p>\n<h2>The Social Preview Problem</h2>\n<p>When you share a link on LinkedIn, Twitter, or WhatsApp, these platforms fetch your page and look for Open Graph meta tags:</p>\n<pre><code class=\"language-html\">&lt;meta property=&quot;og:title&quot; content=&quot;My Article Title&quot; /&gt;\n&lt;meta property=&quot;og:description&quot; content=&quot;A compelling summary...&quot; /&gt;\n&lt;meta property=&quot;og:image&quot; content=&quot;https://example.com/og-image.png&quot; /&gt;\n</code></pre>\n<p>My blog had none of this. Every article was a React SPA that fetched content at runtime. By the time the JavaScript loaded the article data, the social crawler had already given up.</p>\n<p>The fix was obvious: generate static HTML with proper meta tags.</p>\n<h2>Generating the OG Image</h2>\n<p>First, I needed an image. I used our MCP Mesh to call <a href=\"https://openrouter.ai/google/gemini-2.5-flash-image-preview\">Gemini 2.5 Flash Image Preview (Nano Banana)</a> via OpenRouter — a state-of-the-art image generation model with contextual understanding:</p>\n<p><img src=\"/images/og-default.png\" alt=\"OG Image\"></p>\n<p>One tool call, one image. Saved to <code>public/images/og-default.png</code> and ready for all articles to reference.</p>\n<h2>From SEO Tags to Full SSG</h2>\n<p>Here&#39;s where it got interesting.</p>\n<p>To generate proper SEO tags, I needed to create individual HTML files for each article:</p>\n<pre><code class=\"language-html\">&lt;!-- dist/article/my-post/index.html --&gt;\n&lt;title&gt;My Post | vibegui&lt;/title&gt;\n&lt;meta property=&quot;og:title&quot; content=&quot;My Post&quot; /&gt;\n&lt;meta property=&quot;og:description&quot; content=&quot;Post description...&quot; /&gt;\n&lt;meta property=&quot;og:image&quot; content=&quot;https://vibegui.com/images/og-default.png&quot; /&gt;\n</code></pre>\n<p>But wait — if I&#39;m already generating an HTML file for each article with its title and description... why am I still fetching the article content at runtime?</p>\n<p>The answer: I shouldn&#39;t be.</p>\n<h2>Embed Everything</h2>\n<p>Instead of generating HTML shells that fetch JSON, I now embed the full article content directly:</p>\n<pre><code class=\"language-html\">&lt;div id=&quot;root&quot;&gt;&lt;/div&gt;\n&lt;script id=&quot;article-data&quot; type=&quot;application/json&quot;&gt;\n  {&quot;slug&quot;:&quot;my-post&quot;,&quot;title&quot;:&quot;My Post&quot;,&quot;content&quot;:&quot;# Full markdown here...&quot;}\n&lt;/script&gt;\n</code></pre>\n<p>React reads this on hydration. Zero fetches.</p>\n<p>Same pattern for the homepage — the article manifest is embedded in <code>index.html</code>:</p>\n<pre><code class=\"language-html\">&lt;script id=&quot;manifest-data&quot; type=&quot;application/json&quot;&gt;\n  {&quot;articles&quot;:[...],&quot;projects&quot;:[...]}\n&lt;/script&gt;\n</code></pre>\n<p>And for context pages (my leadership notes):</p>\n<pre><code class=\"language-html\">&lt;script id=&quot;context-data&quot; type=&quot;application/json&quot;&gt;\n  {&quot;path&quot;:&quot;leadership/01_integrity&quot;,&quot;title&quot;:&quot;Integrity&quot;,&quot;content&quot;:&quot;# Full markdown...&quot;}\n&lt;/script&gt;\n</code></pre>\n<p>Every page loads with <strong>zero API calls</strong>. The data is just... there.</p>\n<h2>The Dev Experience: Vite Middleware</h2>\n<p>SSG in production is easy. The tricky part is development.</p>\n<p>In dev mode, I want hot reload. But the SSG HTML files are pre-generated. How do I serve them through Vite with HMR?</p>\n<p>The solution: a custom Vite middleware that intercepts article and context routes, reads the pre-generated HTML, extracts the embedded data, injects it into the main <code>index.html</code>, and transforms it through Vite:</p>\n<pre><code class=\"language-typescript\">// vite.config.ts\nfunction ssgDevMiddleware(): Plugin {\n  return {\n    name: &quot;ssg-dev-middleware&quot;,\n    configureServer(server) {\n      server.middlewares.use(async (req, res, next) =&gt; {\n        // Intercept /article/* and /context/* routes\n        // Read SSG HTML from .build/\n        // Extract embedded data script\n        // Inject into main index.html\n        // Transform through Vite (adds HMR client)\n        const transformed = await server.transformIndexHtml(url, html);\n        res.end(transformed);\n      });\n    },\n  };\n}\n</code></pre>\n<p>Now I get the best of both worlds: SSG content with full hot reload.</p>\n<h2>Simplified Cloudflare Build</h2>\n<p>The old build had too many steps. Now it&#39;s two scripts:</p>\n<p><strong>Step 1: <code>generate.ts</code></strong> (needs SQLite)</p>\n<ul>\n<li>Reads content from SQLite database</li>\n<li>Writes <code>manifest.json</code></li>\n<li>Generates article HTML files to <code>.build/article/</code></li>\n<li>Generates context HTML files to <code>.build/context/</code></li>\n</ul>\n<p><strong>Step 2: <code>finalize.ts</code></strong> (no SQLite needed)</p>\n<ul>\n<li>Runs after Vite build</li>\n<li>Copies SSG pages to <code>dist/</code></li>\n<li>Injects production asset references</li>\n<li>Embeds manifest into <code>index.html</code></li>\n</ul>\n<p>On Cloudflare Pages:</p>\n<ul>\n<li>No <code>npm install</code> (SKIP_DEPENDENCY_INSTALL=true)</li>\n<li>No Vite build (assets committed to git)</li>\n<li>Just two Node.js scripts</li>\n<li><strong>~15 second deploys</strong></li>\n</ul>\n<h2>Context Pages Get Full SEO</h2>\n<p>While I was at it, I gave context pages the same treatment:</p>\n<pre><code class=\"language-html\">&lt;title&gt;Integrity: The First Foundation | vibegui&lt;/title&gt;\n&lt;meta name=&quot;description&quot; content=&quot;Integrity means nothing is hidden...&quot; /&gt;\n&lt;meta property=&quot;og:title&quot; content=&quot;Integrity: The First Foundation&quot; /&gt;\n&lt;meta name=&quot;twitter:card&quot; content=&quot;summary&quot; /&gt;\n</code></pre>\n<p>The description is auto-extracted from the first paragraph of the markdown — no more lazy &quot;LLM-generated summary&quot; placeholders.</p>\n<h2>The Architecture Now</h2>\n<pre><code>┌─────────────────────────────────────────────────────────────────┐\n│               scripts/generate.ts                               │\n│                                                                 │\n│   SQLite → manifest.json                                        │\n│          → .build/article/{slug}/index.html (embedded content)  │\n│          → .build/context/{path}/index.html (embedded content)  │\n└───────────────────────────┬─────────────────────────────────────┘\n                            │\n                            ▼\n┌─────────────────────────────────────────────────────────────────┐\n│               vite build (local only)                           │\n│                                                                 │\n│   In dev: middleware serves SSG pages with HMR                  │\n│   In prod: bundles React app → dist/                            │\n└───────────────────────────┬─────────────────────────────────────┘\n                            │\n                            ▼\n┌─────────────────────────────────────────────────────────────────┐\n│               scripts/finalize.ts                               │\n│                                                                 │\n│   • Embed manifest into index.html                              │\n│   • Copy SSG pages to dist/                                     │\n│   • Inject production assets into SSG HTML                      │\n└───────────────────────────┬─────────────────────────────────────┘\n                            │\n                            ▼\n┌─────────────────────────────────────────────────────────────────┐\n│               Cloudflare Pages                                  │\n│                                                                 │\n│   • No npm install needed                                       │\n│   • ~15 second deploys                                          │\n│   • Every page has full SEO meta tags                           │\n│   • Zero runtime fetches                                        │\n└─────────────────────────────────────────────────────────────────┘\n</code></pre>\n<h2>What I Learned</h2>\n<p><strong>1. SEO requirements lead to better architecture</strong></p>\n<p>Wanting proper social previews forced me to generate real HTML. Once I had real HTML, embedding data was obvious.</p>\n<p><strong>2. Dev experience matters</strong></p>\n<p>SSG is useless if it kills your dev workflow. The Vite middleware keeps hot reload working while serving pre-generated content.</p>\n<p><strong>3. Simplify relentlessly</strong></p>\n<p>Three build scripts became two. Runtime fetches became zero. Cloudflare deploys went from minutes to seconds.</p>\n<p><strong>4. Embed beats fetch for static content</strong></p>\n<p>If the data doesn&#39;t change between page loads, it shouldn&#39;t require a network request. Put it in the HTML.</p>\n<h2>What&#39;s Next</h2>\n<p>The architecture is finally simple enough that I understand every step. No magic, no fetches, no surprises.</p>\n<p>Share this post on LinkedIn. Check the preview. It works now.</p>\n<hr>\n<p><em>Five hours of vibe coding with Claude. Every change documented through MCP tools.</em></p>\n","layout":"prose","date":"2026-01-01","status":"published","tags":["tech:cloudflare","tech:ssg","tech:vite","topic:architecture","topic:performance","type:devlog"],"coverImage":null}</script>
