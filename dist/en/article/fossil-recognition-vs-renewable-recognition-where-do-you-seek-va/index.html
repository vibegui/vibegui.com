    <script id="article-data" type="application/json">{"slug":"fossil-recognition-vs-renewable-recognition-where-do-you-seek-va","locale":"en","translationKey":"linkedin:7278511693729587200","path":"/en/article/fossil-recognition-vs-renewable-recognition-where-do-you-seek-va/","alternatePath":"/article/reconhecimento-fossil-vs-reconhecimento-renovavel-onde-voce-busca-validacao/","title":"Fossil Recognition vs. Renewable Recognition: Where Do You Seek Validation?","description":"Are you renewable, hybrid, or still 100% dependent on fossil recognition? A reflection on where we seek validation.","html":"<p>Are you renewable, hybrid, or still 100% dependent on fossil recognition? 🦖 🦴</p>\n<p>Fossil recognition is the kind that&#39;s finite, has to be mined constantly, and must come from outside. It&#39;s not sustainable because you&#39;re always needing more and more admiration and external validation. I spent 30 years of my life desperately seeking this recognition from others — from teachers, leaders, women, whoever. It comes from our ego&#39;s need to be admired and appear good.</p>\n<p>But eventually I stumbled upon the technology of renewable recognition, which comes from intrinsic sources and, every morning, is there again. It&#39;s the recognition you offer yourself, and it&#39;s also the gratitude you express for everything you&#39;ve already achieved. This recognition no longer depends on what others think: it starts to depend on your own RESULTS. You learn to recognize yourself through results and guide yourself by the actions that will deliver more results. The rest is history.</p>\n<p>Where are you seeking recognition? In others&#39; approval, or in your own results? Results don&#39;t need to be explained. Be careful — if you&#39;re explaining yourself, you might be seeking approval instead of results. This might be an invitation to revisit your priorities.</p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_voc%C3%AA-%C3%A9-renov%C3%A1vel-h%C3%ADbrido-ou-ainda-precisa-activity-7278511693729587200-CapQ\">LinkedIn</a> on December 27, 2024.</em></p>\n","layout":"prose","date":"2024-12-27","status":"published","tags":["linkedin-import","mindset","personal-growth"],"coverImage":null}</script>
