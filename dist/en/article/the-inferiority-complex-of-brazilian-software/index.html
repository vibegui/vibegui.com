    <script id="article-data" type="application/json">{"slug":"the-inferiority-complex-of-brazilian-software","locale":"en","translationKey":"linkedin:7261709490469683201","path":"/en/article/the-inferiority-complex-of-brazilian-software/","alternatePath":"/article/o-complexo-de-inferioridade-do-software-brasileiro/","title":"The Inferiority Complex of Brazilian Software","description":"Why saying Brazilian software \"competes with\" foreign tools is an insult, not a compliment.","html":"<p>I HATE it when someone reviews Brazilian software and says, astonished, that it &quot;competes head-to-head&quot; with foreign tools. Really? You expected it to compete... sideways?</p>\n<p>Think about what&#39;s implied in that phrase. For that to be a &quot;positive surprise,&quot; the baseline expectation must be that we&#39;re inferior. </p>\n<p>And we&#39;re not.</p>\n<p>We have the second-largest developer community in the Western world. We&#39;ve built world-class companies. We&#39;ve shipped products used by millions globally.</p>\n<p>The inferiority complex isn&#39;t about our code. It&#39;s about our beliefs. </p>\n<p>When we expect to be worse, we celebrate mediocrity as success. When we assume foreign is better, we don&#39;t push ourselves to lead.</p>\n<p>Stop being surprised when Brazilian software is excellent. Start expecting it.</p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_eu-odeio-quando-algu%C3%A9m-faz-review-de-software-activity-7261099728266498049-LqV6\">LinkedIn</a> on November 11, 2024.</em></p>\n","layout":"prose","date":"2024-11-11","status":"published","tags":["brazil","linkedin-import","mindset","tech"],"coverImage":null}</script>
