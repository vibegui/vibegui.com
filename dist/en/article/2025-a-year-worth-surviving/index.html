    <script id="article-data" type="application/json">{"slug":"2025-a-year-worth-surviving","locale":"en","translationKey":"article:2025-a-year-worth-surviving","path":"/en/article/2025-a-year-worth-surviving/","title":"2025 - A year worth surviving","description":"Reflections on a year that nearly broke us — and what we learned about focus, leadership, and building something meant to last.","html":"<p>We started the year with over 50 people, a burn rate that only makes sense when everything goes right, and a lot of confidence that we were early enough to figure things out as we went. By March, it was already clear that this wouldn&#39;t be that kind of year.</p>\n<p>The company came very close to not making it.</p>\n<p>What followed wasn&#39;t a single dramatic moment, but months of hard decisions, rewrites, tradeoffs, and uncomfortable clarity. We ended the year with 24 people, roughly 3x revenue growth over last year, and operating at break-even. Same company, very different shape.</p>\n<p>This year taught me more than I expected — mostly about focus, trust, and what it actually takes to build something meant to last.</p>\n<h2>Focus hurts more than it sounds</h2>\n<p>One of the clearest lessons this year was that focus isn&#39;t about knowing what to do. It&#39;s about being willing to let go.</p>\n<p>AI makes this harder, not easier. Every week there&#39;s a new capability, a new angle, a new &quot;also we could…&quot;. We felt that pull constantly. At different moments, we were building things that were flexible, impressive, and still not sharp enough.</p>\n<p>The turnaround only really started when we reduced surface area:</p>\n<ul>\n<li>fewer bets</li>\n<li>clearer customers</li>\n<li>fewer things that &quot;could&quot; be products</li>\n<li>more things that had to work, reliably, for someone specific</li>\n</ul>\n<p>Letting go of ideas you like is harder than coming up with new ones.</p>\n<p>A concrete example: we watched Lovable start from basically where we were, but they made more pragmatic choices and focused on the prompt box. Their results speak for themselves. Meanwhile, we fumbled on webdraw and a canvas-first approach that tried to do too much.</p>\n<p>The lesson I took from this: emulating other people&#39;s success seldom reveals the path to your own. And acting out of envy is a surefire way to get nowhere. The right answer isn&#39;t to copy what&#39;s working for someone else — it&#39;s to understand what you&#39;re uniquely positioned to build, and commit to that.</p>\n<h2>Leadership closer to reality</h2>\n<p>Living close to the edge changes how you think about leadership.</p>\n<p>There&#39;s a version of leadership that&#39;s about energy and storytelling. That version doesn&#39;t help much when you&#39;re staring at cash flow, payroll dates, and the real consequences of past decisions.</p>\n<p>This year, leadership meant:</p>\n<ul>\n<li>saying the numbers out loud</li>\n<li>not hiding uncertainty behind optimism</li>\n<li>making decisions that disappointed good people</li>\n<li>staying present through the weight of it</li>\n</ul>\n<p>Integrity stopped being an abstract value and became something very concrete: saying what&#39;s true, repairing quickly when trust is strained, and not outsourcing reality to the future.</p>\n<h2>Growing up technically and operationally</h2>\n<p>One important shift this year was our decision to move away from a heavily managed, opinionated infrastructure setup and commit to a fully open-source, self-hosted core.</p>\n<p>This wasn&#39;t about survival. It was about giving ourselves a real chance to become global and to serve enterprise customers — many of whom simply require self-hosting, ownership, and deep control over their systems.</p>\n<p>That choice came with more responsibility and more work, but it unlocked important things:</p>\n<ul>\n<li>architectural clarity</li>\n<li>credibility with serious customers</li>\n<li>freedom to reason about cost, performance, and security at a deeper level</li>\n<li>the ability to build primitives meant to last, not short-term integrations</li>\n</ul>\n<p>Alongside that, we did an enormous amount of work on optimization — across site serving, performance, caching, delivery, and infrastructure. Much of it was invisible from the outside, but it mattered. And we&#39;re far from done: the backlog of optimizations we want to ship is still huge, and genuinely exciting.</p>\n<h2>Our third successful Black Friday</h2>\n<p>One moment that made the year feel concrete was Black Friday.</p>\n<p>It was our largest one ever. Preparation was intense: months of stress-testing, tightening infrastructure, planning for failure modes, and making sure we could actually stand behind what we were shipping.</p>\n<p>When the week came, things held up. Most customers sold 2–5x more than last year, and the systems behaved the way we expected them to. After everything earlier in the year, that was deeply reassuring. We&#39;re very glad for helping our customers serve some of the highest-volume sites in Brazil, and we will only serve more of those in 2026 — globally.</p>\n<h2>People, departures, and trust</h2>\n<p>Several people left Deco this year. Including Lucis, who chose to follow his own path.</p>\n<p>I&#39;m genuinely thankful to everyone who did. Every contribution mattered, and clean endings are part of integrity too. Paths diverge. That&#39;s normal.</p>\n<p>At the same time, I&#39;m even more thankful to the people who stayed. We would not be here without your trust.</p>\n<p>The average tenure at Deco is now around 22 months. That&#39;s a long time. It says something about long-term thinking, and about choosing to go through difficult periods together.</p>\n<p>What we have now is a tighter team with big ambitions — and a much deeper respect for continuity.</p>\n<p>I also want to explicitly acknowledge Rafael Crespo (Baby), my co-founder. Through good moments and bad ones, you&#39;ve been a constant partner — present, honest, and committed when it really counted. That kind of partnership is rare, and I don&#39;t take it for granted. It&#39;s been great 3 years. Here&#39;s to the next 30.</p>\n<h2>Carrying this into 2026</h2>\n<p>I&#39;m entering the next year calmer than before. More respectful of constraints. And, of course... vibecoding every day!</p>\n<p>What I&#39;m taking with me:</p>\n<ul>\n<li>a deeper understanding of focus</li>\n<li>more humility around product scope</li>\n<li>stronger conviction around open systems and ownership</li>\n<li>renewed respect for long-term trust</li>\n<li>a team that knows why we&#39;re here</li>\n</ul>\n<p>By any reasonable measure, 2025 was a great year. It was hard, but the results were real: a healthier company, stronger fundamentals, customers growing significantly, and a team that proved it can navigate pressure together.</p>\n<p>The work now is to make those learnings count.</p>\n<p>2026 needs to be a year of focused, disciplined execution. Fewer bets. Clear priorities. Total commitment to the things we choose to build. Less exploration for its own sake, more depth and follow-through.</p>\n<p>There&#39;s a lot ahead of us — especially around AI-native ecommerce and sites built on AI as a foundation. The difference now is that we&#39;re approaching it with clarity, restraint, and a much stronger base.</p>\n<p>That feels like a good place to start the next year.</p>\n","layout":"prose","date":"2025-12-31","status":"published","tags":["2025","deco","leadership","startup","year-in-review"],"coverImage":null}</script>
