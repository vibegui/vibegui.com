    <script id="article-data" type="application/json">{"slug":"embrace-crazy-opportunities-the-story-of-our-web-summit-victory","locale":"en","translationKey":"linkedin:7269832451676393472","path":"/en/article/embrace-crazy-opportunities-the-story-of-our-web-summit-victory/","alternatePath":"/article/abrace-oportunidades-malucas-a-historia-da-nossa-vitoria-no-web-summit/","title":"Embrace Crazy Opportunities: The Story of Our Web Summit Victory","description":"How we won the Web Summit Pitch competition with a deck written over a weekend—and what it taught me about seizing unexpected chances.","html":"<p>It&#39;s surreal to think it was just this year that we won the Web Summit Pitch! The funniest thing is that we didn&#39;t prepare for it 😬 it&#39;s almost embarrassing to tell.</p>\n<p>The reality is we were in an insane month, with 3 huge events BESIDES the Web Summit. Last year, WS hadn&#39;t been very impactful for us (our audience was more enterprise/retail) and we were planning to go to WS only on the day of our stand, the third day of the event.</p>\n<p>And then... at the last minute, on Friday, we discovered we&#39;d been called for the Pitch. But we hadn&#39;t submitted the deck and it was next week 😂 Result: we spent all of Saturday and Sunday writing a pitch from scratch that reflected our company&#39;s current moment. (Weekend warriors Luciano Júnior, Rafael Crespo and Lucas Ribeiro)</p>\n<p>But to participate, we had to go on the first day: there were 3 phases, one each day of the event. I went there with no idea what would happen. I gave the pitch. And I made it to the second day! Wow. OK, we went back on the second day, but we probably won&#39;t make it here, lots of cool startups. And there we went, approved for the third day. OK, now I wanted to win 😅 so on the third day I went with all my energy.</p>\n<p>It worked. And this victory that we didn&#39;t plan but, given the chance, executed with great vigor, was one of the best exposures we&#39;ve ever had. All the time someone sends me this Web Summit ad 🥲</p>\n<p>The moral of the story is: <strong>embrace crazy opportunities that appear</strong>. You never know where they might lead. If you use every chance that appears to the maximum of your capacity, one of them will reward you extraordinarily.</p>\n<p>(And others will say it was luck 😉)</p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_surreal-pensar-que-foi-ainda-esse-ano-que-activity-7269832451676393472-u_ql\">LinkedIn</a> on December 3, 2024.</em></p>\n","layout":"prose","date":"2024-12-03","status":"published","tags":["founder-story","linkedin-import","opportunity","startup"],"coverImage":null}</script>
