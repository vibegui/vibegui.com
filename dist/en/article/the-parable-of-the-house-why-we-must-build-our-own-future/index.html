    <!-- Embedded article data (after root so DOM is ready when React reads it) -->
    <script id="article-data" type="application/json">{"slug":"the-parable-of-the-house-why-we-must-build-our-own-future","locale":"en","translationKey":"linkedin:7258072637707329536","path":"/en/article/the-parable-of-the-house-why-we-must-build-our-own-future/","alternatePath":"/article/a-parabola-da-casa-por-que-devemos-construir-nosso-proprio-futuro/","title":"The Parable of the House: Why We Must Build Our Own Future","description":"An allegory about brain drain, serving others'' empires, and the cost of not building your own home.","html":"<p>You were born in a house with many brothers and sisters. It&#39;s an enormous house, but poorly maintained, and you and your siblings suffer from various afflictions. All your life you heard that beyond that puddle, far away (the puddle is wide), there exists another house, much better. There are fewer people in that house, and everything is renovated and new. Nobody suffers from basic problems.</p>\n<p>And so you grew up and decided that fixing your house is impossible. And that you deserve a better house for yourself. And you navigate across the puddle and arrive at this new house. Indeed, it&#39;s all perfect. But the owners of the house don&#39;t like to work much. Actually, you&#39;re welcome in this house, as long as you don&#39;t make too much noise and clean the floors, the bathrooms, and make improvements around the house. But that&#39;s not so bad: the house is already well organized, has all the cleaning supplies and resources.</p>\n<p>And you spend years improving this house—of a family that isn&#39;t yours. The food in the house isn&#39;t yours. But it&#39;s not so bad... The music isn&#39;t yours. But... Time passes. You receive news from the other side of the puddle, and things have gotten worse. Without you there, there are even fewer capable people to take care of and evolve the house. And every day you wake up and work to improve other people&#39;s house, in the beyond-puddle. Time passes. Bad news. Your parents die. You weren&#39;t there. Time passes. You miss your house. You wonder what could have become of your house, if you had stayed.</p>\n<p>One day you realize that every year more brothers and sisters arrive, and that this strange house you&#39;ve built only works because countless brothers and sisters of yours also believed that the beyond-puddle house was better, and that it wasn&#39;t worth fixing their own house.</p>\n<p>Then, by accident, you enter the office of the owner of the foreign house. And you discover... that whoever invented all those stories from your childhood, all the songs, all the movies that told you it wasn&#39;t worth building your own house... were the owners of the house that enslaved you.</p>\n<p>And now everything makes sense. Your house was always deceived. And you gave up building your own house to edify others&#39;.</p>\n<p>You die alone, in the cold, without your food, without your music, without your brothers and sisters. But you know you won&#39;t be missed. The narrative machine continues, and your brothers and sisters will keep coming to serve the beyond-puddle house, willingly, without knowing that by doing so they condemn the next generations to remain in a house eternally under construction.</p>\n<p><strong>Think carefully before accepting the siren&#39;s song of the puddle. Nobody will build our house for us.</strong></p>\n<p><em>&quot;In history, rebellion is not always rewarded, but obedience is invariably punished.&quot;</em> — Roberto Mangabeira Unger</p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_voc%C3%AA-nasceu-numa-casa-com-muitos-irm%C3%A3os-e-activity-7258072637707329536-5m8I\">LinkedIn</a> on November 1, 2024.</em></p>\n","layout":"prose","date":"2024-11-01","status":"published","tags":["brain-drain","brazil","linkedin-import","purpose"],"coverImage":null}</script>
