    <script id="article-data" type="application/json">{"slug":"5-essential-feedbacks-for-creating-winning-ai-products","locale":"en","translationKey":"linkedin:7406138466864017408","path":"/en/article/5-essential-feedbacks-for-creating-winning-ai-products/","alternatePath":"/article/5-feedbacks-essenciais-para-criar-produtos-de-ia-vencedores/","title":"5 Essential Feedbacks for Creating Winning AI Products","description":"Lessons from judging an AI hackathon—on focus, distribution, and why capitalism works.","html":"<p>Today I had the pleasure of being a judge at the &quot;Devs de Impacto&quot; hackathon. It was sensational! At the end, I gave 5 feedbacks for the teams to do even better next time. When I was leaving, one of the participants asked if I could send the feedback, and I committed to writing it down. Here they are:</p>\n<p><strong>1. FOCUS!</strong> Many projects failed by excess. Technology is very powerful and opens many possibilities. But to create a product that wins the market, this is a problem! When you dig around a problem, a bunch of &quot;Also Works For This&quot; appears—it also solves this and that. Forget it! Choose ONE ICP (Ideal Customer Profile), choose ONE pain point (preferably the hair-on-fire type), and make ONE solution (preferably an agent that solves a problem on autopilot).</p>\n<p><strong>2. Changing habits requires economic incentive 99% of the time.</strong> Assuming someone will download your app because it&#39;s cool or innovative... unfortunately, is very naive. We are bombarded by ads from companies with deep pockets competing for our attention in a permanent auction. People only stop their lives to do something that makes a HUGE difference to them, generally because it solves an enormous problem (like &quot;I want to get around&quot; or &quot;I want dinner&quot;). Corollary: it&#39;s much easier to make something for Companies than for Consumers... there&#39;s a lot of quantifiable pain.</p>\n<p><strong>3. Product (and code) is MUCH easier (especially post-AI) than Distribution.</strong> At the hackathon we get excited to see the demo and see that it works. But the real world isn&#39;t about the product working—it&#39;s about the product working <em>for an audience that decides to test and adopt.</em> No audience, no product. Therefore: models that depend on &quot;everyone downloading my app&quot; to work are &quot;dead on arrival.&quot; Seek to leverage existing distribution layers. Make current distributors (who already have an audience) have a reason to distribute you.</p>\n<p><strong>4. Capitalism works</strong> (here comes the controversy) — when you think something &quot;should be a certain way,&quot; research deeply <em>why it isn&#39;t now</em>. The more mature a value chain, the greater the chance it&#39;s already &quot;optimized,&quot; meaning the players have already discovered ways to make it more efficient. If you&#39;re seeing a &quot;giant hole,&quot; you&#39;d better check three times if there really is a hole, and why you&#39;re so brilliant to be seeing it when all the companies and individuals in that sector aren&#39;t.</p>\n<p><strong>5. We waste time inventing a bunch of marketplaces and complicated value propositions, but the reality is that Artificial Intelligence offers an absurdly obvious path to generate value: automate an EXISTING ROLE!</strong> A company that spends X thousands of reais per month on &quot;contract review freelancers&quot; will certainly immediately understand the value proposition of a &quot;contract review agent&quot; that costs X/10 and delivers X*2. No need to invent a model: find repetitive work, automate it, and sell.</p>\n<p>That&#39;s it! Congratulations to all the teams!</p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_hoje-eu-tive-o-prazer-de-ser-jurado-na-devs-activity-7406138466864017408-RFk_\">LinkedIn</a> on December 15, 2025.</em></p>\n","layout":"prose","date":"2025-12-15","status":"published","tags":["ai","linkedin-import","product","startup"],"coverImage":null}</script>
