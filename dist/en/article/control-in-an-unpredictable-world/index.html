    <script id="article-data" type="application/json">{"slug":"control-in-an-unpredictable-world","locale":"en","translationKey":"article:control-in-an-unpredictable-world","path":"/en/article/control-in-an-unpredictable-world/","title":"Control in an Unpredictable World","description":"A Steve Zaffron pearl on what you can actually control — with an accurate transcript, because YouTube captions destroy the distinctions.","html":"<p>YouTube&#39;s auto-captions turn Steve Zaffron into nonsense. This pearl is about what you can actually control when everything feels out of control — and the distinctions live in the language. If the words are wrong, the whole thing disappears.</p>\n<p>So here&#39;s the accurate transcript, with the original video.</p>\n<p><strong>Watch:</strong> <a href=\"https://www.youtube.com/watch?v=dh4VBSbgFkQ\">Control in an Unpredictable World</a></p>\n<div class=\"video-embed\">\n<iframe src=\"https://www.youtube.com/embed/dh4VBSbgFkQ\" title=\"Control in an Unpredictable World — Steve Zaffron\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen loading=\"lazy\"></iframe>\n</div>\n\n<h2>Transcript</h2>\n<p>In these shocking, unpredictable, uncertain times, one of the fundamental questions we deal with is: How do I control things? What can I control? Can I control anything? Things seem to be out of control.</p>\n<p>Well, here&#39;s the bad news: Most of what you think you can control, you can&#39;t.</p>\n<p>There&#39;s an illusion in life that we live in, and now we have an opportunity to really get clear about it. The illusion is that life&#39;s got a predictability to it. Oh yes, from time to time something happens, and it&#39;s shocking and sad, but that&#39;s just from time to time.</p>\n<p>No. The illusion is that it&#39;s from time to time. It&#39;s always.</p>\n<p>I&#39;m talking to you right now. I could have a heart attack. That&#39;s normal life. Driving to work—people didn&#39;t expect to get into an accident, the ones who did and didn&#39;t make it to work. That was unpredictable.</p>\n<p>If you look at the reality of your day-to-day existence when it was &quot;normal,&quot; it really was unpredictable and uncertain. But we cover it over because it&#39;s almost unconfrontable. We cover it over with this illusion.</p>\n<p>We call that the tranquilized obviousness.</p>\n<p>There&#39;s an obviousness that we live inside of. It&#39;s like the illusion of life, and it tranquilizes us. It actually makes us unconscious of the reality of life.</p>\n<p>Well, that&#39;s been stripped away. The coronavirus has stripped it away. The whole world is dealing with the fact that life is uncertain at this moment. And what empowers people is to get that it really always has been that way.</p>\n<p>It&#39;s really nothing different. Really nothing different. Different things we have to do. Hey, I&#39;m hunkered down at home. Maybe you are too. Or you&#39;re dealing with life however you&#39;re dealing with it. We&#39;re washing our hands all the time. We&#39;re doing things we never did before, and that&#39;s appropriate to deal with this situation.</p>\n<p>What&#39;s not empowering is to think there&#39;s something wrong because it&#39;s all uncertain. It&#39;s all uncertain, and there&#39;s nothing wrong.</p>\n<p>We have views about it. We have opinions about it. We blame people for it, or it&#39;s this country&#39;s fault, or that country&#39;s fault, or someone&#39;s fault. But all of those assessments, interpretations, all those views of life that disempower ourselves—because they don&#39;t leave us anywhere; they just leave us with a reaction—all of that&#39;s unnecessary. In fact, not only is it unnecessary, it&#39;s unproductive.</p>\n<p>So, over what do I have control? Well, let&#39;s take a look at it.</p>\n<p>At this moment, I have some sensations going on in my body. I have feelings. I have emotions. I have no control over that. I can&#39;t just change it, have it be some other way in this moment.</p>\n<p>Certainly, what&#39;s happening in the world, I can&#39;t just change in this moment. And we can go between myself and the world and all the aspects that we think we have control over. We really don&#39;t.</p>\n<p>Seems kind of dismal. But wait. There is something I have control over, and it&#39;s a very powerful, powerful aspect to empowering myself in life, and empowering you, perhaps, in life.</p>\n<p>Try it out. You have to really try these ideas out for them to make any difference. They&#39;re interesting concepts, but the living of it, the trying it out, the putting it on—putting it on like you&#39;re putting on a suit jacket or a dress—putting it on is what makes a difference.</p>\n<p>So what I have control over is what I say, or what I don&#39;t say.</p>\n<p>Or, more fundamentally, the context—the fundamental way in which I see myself and the world at this moment. The context for my being in life in this moment.</p>\n<p>And the context is made up of a number of elements, which we&#39;ll get to in this series of conversations.</p>\n<p>One of the elements is: What commitments do you have in this moment? Commitments to yourself, commitments to others. What&#39;s the nature of those commitments? Are they empowering? If they&#39;re not empowering, hey, I have something to say about that, because the commitments that I&#39;m living are commitments I say.</p>\n<p>What are the values that I&#39;m dealing with in this moment? What&#39;s a value to me? What&#39;s a value for me and the people I&#39;m related to? What could be a value? What can I bring to my everyday moment as a value to live from, and with which to support people?</p>\n<p>So I&#39;m inviting you to look at the context—the space in which you&#39;re dealing with life in this moment—and see if it&#39;s empowering. And if it&#39;s not, we&#39;ll talk about how to transform that context into something empowering.</p>\n<hr>\n<p><em>Pearl by <a href=\"https://www.youtube.com/watch?v=dh4VBSbgFkQ\">Steve Zaffron</a>. Transcript cleaned for readability.</em></p>\n","layout":"prose","date":"2026-08-04","status":"published","tags":["steve-zaffron","leadership","mindset","transcript"],"coverImage":null}</script>
