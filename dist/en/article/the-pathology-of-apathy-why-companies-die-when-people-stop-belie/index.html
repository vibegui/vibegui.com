    <!-- Embedded article data (after root so DOM is ready when React reads it) -->
    <script id="article-data" type="application/json">{"slug":"the-pathology-of-apathy-why-companies-die-when-people-stop-belie","locale":"en","translationKey":"linkedin:7351546854901268482","path":"/en/article/the-pathology-of-apathy-why-companies-die-when-people-stop-belie/","alternatePath":"/article/a-patologia-da-apatia-por-que-empresas-morrem-quando-pessoas-deixam-de-acreditar/","title":"The Pathology of Apathy: Why Companies Die When People Stop Believing","description":"Companies don't end because they run out of money. They end because people stop caring about a powerful future.","html":"<p>Companies don&#39;t end because they run out of money. They end because people stop believing and caring about a powerful future.</p>\n<p>If there&#39;s one thing that&#39;s forbidden in our company, it&#39;s &quot;apathy.&quot;</p>\n<p>You can disagree with any idea, you can get angry, you can spit in my face during a discussion, and none of that will result in you leaving the team.</p>\n<p>But the moment a person &quot;unplugs&quot; from week start meetings, week end meetings, and mini demos (our daily half-hour show-and-tell space at the end of the afternoon), it means the person has &quot;given up on being a protagonist&quot; in the company&#39;s future.</p>\n<p>Our company is remote, everyone stays on Discord and we have precious little moments of sync rituals. Disengaging from these rituals is disengaging from the future.</p>\n<p>Understand, I&#39;m not being precious or tyrannical. It&#39;s that it&#39;s <em>literally impossible</em> to build something truly innovative and high quality if the ENTIRE team isn&#39;t infinitely excited and super engaged.</p>\n<p><strong>Each person who is disengaged on your team is a silent vector of deceleration and disbelief.</strong> It slows down everyone around them, because they&#39;re just doing the minimum.</p>\n<p>Don&#39;t allow this on your team, or prepare for a slow and painful death as a company.</p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_empresas-n%C3%A3o-acabam-por-que-acabou-o-dinheiro-activity-7351546854901268482-kwIe\">LinkedIn</a> on July 17, 2025.</em></p>\n","layout":"prose","date":"2025-07-17","status":"published","tags":["culture","leadership","linkedin-import","startup"],"coverImage":null}</script>
