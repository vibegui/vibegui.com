    <script id="article-data" type="application/json">{"slug":"the-world-belongs-to-those-who-do-not-those-who-only-know","locale":"en","translationKey":"linkedin:7342856873798172673","path":"/en/article/the-world-belongs-to-those-who-do-not-those-who-only-know/","alternatePath":"/article/o-mundo-e-de-quem-faz-nao-de-quem-apenas-sabe/","title":"The World Belongs to Those Who Do, Not Those Who Only Know","description":"Why action beats knowledge in the AI age—and the trap of endless preparation.","html":"<p>We were taught that &quot;those who prepare and study hard will get a better job.&quot; The classic adolescent terror of needing to get into a &quot;good university&quot; because &quot;someone will look at the resume pile and discard you if you&#39;re not from the top 5.&quot;</p>\n<p>And indeed, for a long time, preparing and &quot;obtaining knowledge&quot; to differentiate yourself from others contributed to the appreciation of your time.</p>\n<p>But now knowledge comes from the power outlet. You can have a nuclear physicist or a Nobel Prize-winning historian in your pocket.</p>\n<p><strong>The world has always been, in the end, for those who DO, more than those who &quot;KNOW.&quot;</strong></p>\n<p>But now, on top of that, the cost of KNOWING is basically zero.</p>\n<p>In other words, there&#39;s only one true differentiator: DOING.</p>\n<p>I feel sorry for the generations of children who will still be born with lag, preparing for school-university-MBA, only to discover that all this preparation is no substitute for ACTION.</p>\n<p><em>PS: I&#39;m not against studying. I&#39;m against studying as an end. Studying is a means to become capable of DOING something. The cerebral epistemological addiction to accumulating knowledge is the pleasure of those who don&#39;t dare fail in the real world—you can&#39;t read wrong. But doing is pure repetition of error!</em></p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_n%C3%B3s-fomos-ensinados-que-quem-se-preparar-activity-7342856873798172673-pxAk\">LinkedIn</a> on June 23, 2025.</em></p>\n","layout":"prose","date":"2025-06-23","status":"published","tags":["action","ai","linkedin-import","mindset"],"coverImage":null}</script>
