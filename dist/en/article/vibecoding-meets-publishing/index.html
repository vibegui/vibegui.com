    <script id="article-data" type="application/json">{"slug":"vibecoding-meets-publishing","locale":"en","translationKey":"article:vibecoding-meets-publishing","path":"/en/article/vibecoding-meets-publishing/","title":"Vibecoding Meets Publishing","description":"How MCP mesh and custom skills turned Claude Code into an end-to-end agentic blog pipeline","html":"<p>I typed <code>/article:new</code> into my terminal. Five minutes later — researched, illustrated, published. I never left the terminal.</p>\n<p>The blog is vibecoded now.</p>\n<p>I chose the topic, the angle, the audience. The agent handled the research, the structuring, the image generation, the database publishing — all through natural language commands in Claude Code. Two patterns made this possible, and most people building agentic workflows are missing at least one of them.</p>\n<h2>Why most AI content pipelines fail</h2>\n<p>The skeptics have a point.</p>\n<p>Industry analysts call agentic AI content &quot;a 65% solution — impressive in demos but messy in real-world deployment.&quot; Gartner projects 40% of agentic AI projects will be scrapped by 2027. I get it.</p>\n<p>I&#39;ve lived this. You give an LLM access to ten tools and it flails. Calls the wrong one. Forgets the sequence. Produces confident-sounding text that misses the voice, the angle, the point.</p>\n<p>Most of these systems fail because they&#39;re missing one of two things. Usually both.</p>\n<h2>MCP Mesh — the tool layer</h2>\n<p>MCP — the Model Context Protocol — is an open standard for connecting AI agents to external tools. Think of it as USB-C for AI: one protocol, any tool.</p>\n<p>The problem is scale. Three MCP servers and three MCP clients means nine separate configurations. That&#39;s the M×N problem, and it breaks fast.</p>\n<p>MCP Mesh is the fix. It&#39;s an open-source control plane — built by my company, <a href=\"https://github.com/decocms/mesh\">deco</a> — that sits between your clients and your servers. One governed endpoint. You configure your tools once, and any MCP client can use them.</p>\n<p>For this blog, three MCP servers power the pipeline:</p>\n<ul>\n<li><strong>Supabase</strong> — stores articles, handles publishing, manages the database</li>\n<li><strong>Perplexity</strong> — deep research with the sonar-pro model, returning sourced findings</li>\n<li><strong>Nano Banana</strong> — image generation via Gemini models for cover art</li>\n</ul>\n<p>All three connect through the Mesh. Claude Code sees them as available tools, ready to call.</p>\n<pre><code>Claude Code → MCP Mesh → [ Supabase | Perplexity | Nano Banana ]\n</code></pre>\n<p>This gives the agent real capabilities — querying databases, researching with academic rigor, generating images. But capabilities without direction produce noise. An agent with access to Perplexity still doesn&#39;t know <em>when</em> to call it, <em>what</em> to ask, or <em>how</em> to structure the findings.</p>\n<p>That&#39;s the second pattern.</p>\n<h2>Custom skills — the workflow layer</h2>\n<p>Claude Code supports custom slash commands. You drop markdown files into <code>.claude/commands/</code> and they become domain-specific skills. Each file defines an objective, references context files, lays out a step-by-step process, and specifies success criteria.</p>\n<p>I built 10 of these for the blog:</p>\n<p><code>/article:new</code> → <code>/article:research</code> → <code>/article:outline</code> → <code>/article:draft</code> → <code>/article:image</code> → <code>/article:publish</code></p>\n<p>Plus <code>/article:status</code>, <code>/article:resume</code>, <code>/article:preview</code>, and <code>/article:quick</code> for the full workflow.</p>\n<p>The detail matters. <code>/article:research</code> doesn&#39;t just say &quot;do research.&quot; It tells the agent to make 2-4 Perplexity calls using the sonar-pro model, covering topic overview, data and evidence, contrarian viewpoints, and recent developments. It specifies the output format — a structured <code>RESEARCH.md</code> with sections for key findings, notable quotes, contrarian angles, and a synthesis connecting everything back to the brief.</p>\n<p><code>/article:draft</code> references my tone-of-voice guide — a 680-line forensic analysis of how I write, covering hook architecture, sentence rhythm, vocabulary profile, emotional engineering, and philosophical framework. The skill instructs the agent to self-review against the voice checklist before presenting the draft.</p>\n<p>Without MCPs, these skills are beautiful plans with no way to execute. The agent knows it should call Perplexity but has no Perplexity. It knows it should generate a cover image but has no image generation tool. And without skills, the MCPs are powerful tools with no direction — the agent <em>can</em> do anything but doesn&#39;t know what to do <em>first</em>.</p>\n<p>You need both.</p>\n<h2>This article is the proof</h2>\n<p>Here&#39;s exactly what happened during this session:</p>\n<ol>\n<li><code>/article:new</code> — the agent asked me about topic, angle, audience, and key message through interactive questions. Created <code>BRIEF.md</code></li>\n<li><code>/article:research</code> — triggered 3 Perplexity calls via MCP (topic overview, market data, contrarian angles), then read my company&#39;s strategy docs for additional context. Produced <code>RESEARCH.md</code></li>\n<li><code>/article:outline</code> — applied the technical writing blueprint from my tone-of-voice guide, mapped 7 beats with emotional registers and word counts. Produced <code>OUTLINE.md</code></li>\n<li><code>/article:draft</code> — you&#39;re reading it. Written beat-by-beat following the outline, voice-checked against the tone guide</li>\n<li><code>/article:image</code> — called Nano Banana via MCP to generate the cover using Gemini, then optimized it to meet the 250KB constraint</li>\n<li><code>/article:publish</code> — will write the article directly to Supabase via MCP</li>\n</ol>\n<p>Everything in one terminal session. I directed. The agent executed.</p>\n<h2>What I actually learned</h2>\n<p><strong>Skills need success criteria, not just instructions.</strong> The difference between a mediocre skill and a great one is the self-review step. &quot;Write a draft&quot; produces generic text. &quot;Write a draft, then check it against this 10-point voice checklist covering hook patterns, paragraph length, vulnerability moments, and hedging language&quot; produces something I&#39;d actually want to publish. The success criteria are doing more work than the instructions.</p>\n<p><strong>The Mesh makes tools portable.</strong> The same Supabase, Perplexity, and Nano Banana tools that power this pipeline in Claude Code are available in Cursor, Claude Desktop, any MCP client. I configured them once through the Mesh. When I switch editors, the tools come with me.</p>\n<p><strong>I&#39;m still the author.</strong> I chose this topic because I&#39;m building this system and living inside it daily. I chose the angle because I believe the two-pattern insight is genuinely useful. I directed every step — approving the brief, reading the research, reviewing the outline. The agent wrote a line that sounded like AI slop (&quot;No CMS. No context switching. Just an agent with the right tools.&quot;) and I caught it and rewrote it. That editorial loop is the whole point of vibecoding.</p>\n<p><strong>It breaks.</strong> Mid-session, Perplexity&#39;s MCP auth token expired. I had to re-authenticate and re-run the research command. The agent sometimes needs course correction — a research finding that doesn&#39;t fit, an outline beat that needs reordering. The 65% solution critique is fair. But 65% with active human direction gets you to 95%. And 95% at this speed changes what one person can ship.</p>\n<h2>Where this goes</h2>\n<p>This article was written by the system it describes. The research came through Perplexity&#39;s MCP. The cover image came through Nano Banana&#39;s MCP. The published version lives in Supabase. Every step was orchestrated by skills that encode how I think about writing.</p>\n<p>The same architecture applies to anything where the workflow is repeatable but the content is unique. At deco, we&#39;re building this for commerce — agents that ship storefront improvements while you sleep. The blog pipeline is a small proof of the same pattern.</p>\n<p>Software used to enable. Now it does.</p>\n<p>The blog is vibecoded now.</p>\n","layout":"prose","date":"2026-02-17","status":"published","tags":[],"coverImage":"/images/articles/vibecoding-meets-publishing.png"}</script>
