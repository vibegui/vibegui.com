    <script id="article-data" type="application/json">{"slug":"why-i-will-never-move-to-s-o-paulo","locale":"en","translationKey":"linkedin:7283833072624558080","path":"/en/article/why-i-will-never-move-to-s-o-paulo/","alternatePath":"/article/por-que-eu-nunca-irei-morar-em-sao-paulo/","title":"Why I Will Never Move to São Paulo","description":"On choosing your game, defining your conditions of satisfaction, and betting on Rio as a global AI hub.","html":"<p>Often our future is limited by something from the past. Our natural human tendency is to think that the future is a repetition, or a linear progression, of the past. Therefore, it&#39;s predictable what can and cannot happen in X amount of time. I don&#39;t need to explain to you that this is far from the truth, and that any future worth building <em>by definition</em> is not adjacent to the past, but rather an extraordinary leap.</p>\n<p>When you have clarity about the game you&#39;re playing (which extraordinary leap you&#39;re committed to causing), it becomes much easier to understand &quot;what counts&quot; and &quot;what doesn&#39;t count&quot; as success in that game. One of the most important aspects to establish when declaring your future is precisely your &quot;Conditions of Satisfaction.&quot;</p>\n<p>Unlike the limitations of the past, these are limitations you <em>chose</em> for your future, because without them your future wouldn&#39;t be complete. If you achieve the results and metrics you declared but have to give up these conditions, you won&#39;t be fully satisfied. Thus, this condition of satisfaction transforms into a &quot;Condition of the Game&quot; for you.</p>\n<p>I&#39;ve chosen to play the game &quot;Brazil as a Technology Protagonist,&quot; with a minor in &quot;Rio de Janeiro as a Global AI Hub.&quot; To play this game, there are concessions that would make the game lose its meaning. Me packing up and moving to São Paulo, for example, is one of them. I&#39;m not committed to my success <em>at any cost</em>. If I can&#39;t achieve MY success <em>while</em> positioning Rio de Janeiro, that success will have been empty.</p>\n<p>Could it be that one day I&#39;ll have to move <em>temporarily</em> abroad (e.g., NY), given the global nature of our company? It&#39;s possible and I&#39;m ready for that. But I think that, whenever I&#39;m living in Brazil, it doesn&#39;t make sense for me to be &quot;betting&quot; on another ecosystem other than my own—the Carioca one.</p>\n<p>So, Paulistas, I love your city for visiting, it has a lot of good things, but... I have an extraordinary commitment to my city, and it desperately needs more people voting for it. I distinguished this text after having lunch with Rafael Duton this week. It&#39;s a privilege and a pride to have people like him also betting on our city. It gives me even more strength to continue, despite so many people who don&#39;t believe in our future. And everything leads me to believe that we have a golden opportunity to accelerate in this decade.</p>\n<p>Rio: The Global AI Hub.</p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_por-que-eu-nunca-irei-morar-em-s%C3%A3o-paulo-activity-7283833072624558080-jzuu\">LinkedIn</a> on January 11, 2025.</em></p>\n","layout":"prose","date":"2025-01-11","status":"published","tags":["brazil","career","linkedin-import","mission","rio"],"coverImage":null}</script>
