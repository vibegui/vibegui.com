    <script id="article-data" type="application/json">{"slug":"running-local-mcps-stdio-firecrawl-and-the-supabase-migration","locale":"en","translationKey":"article:running-local-mcps-stdio-firecrawl-and-the-supabase-migration","path":"/en/article/running-local-mcps-stdio-firecrawl-and-the-supabase-migration/","title":"Running Local MCPs: STDIO, Firecrawl, and the Supabase Migration","description":"A Saturday coding session that started with wanting to track Perplexity API costs and ended with a complete infrastructure overhaul.","html":"<p>Today&#39;s coding session started with a simple goal: I wanted to use my own Perplexity API key instead of our shared Perplexity MCP. I wanted to see exactly what the enrichment pipeline was costing me, token by token.</p>\n<p>That innocent desire cascaded into implementing STDIO transport support, fixing a binary stream corruption bug in a community MCP, replacing Exa with Firecrawl, migrating 400+ bookmarks from SQLite to Supabase, and optimizing the entire enrichment pipeline for speed.</p>\n<h2>Part 1: The Perplexity Problem</h2>\n<p>My <a href=\"/bookmarks\">bookmark enrichment system</a> uses Perplexity to research each URL before classifying it. Until now, I was using our shared Perplexity MCP hosted on Cloudflare. This worked, but I had no visibility into costs.</p>\n<p>I wanted to run <code>@perplexity-ai/mcp-server</code> locally with my own API key. But our <a href=\"https://github.com/deco-cx/mesh\">MCP Mesh</a> only supported HTTP-based connections. Local MCP servers typically communicate over STDIO — standard input/output streams.</p>\n<p>Time to add STDIO support.</p>\n<h2>Part 2: Implementing STDIO Transport</h2>\n<p>STDIO is how most MCP servers work. The host spawns the server as a child process and communicates over stdin/stdout using JSON-RPC. It&#39;s simpler than HTTP — no ports to manage, no CORS, no authentication. Just pipes.</p>\n<p>I opened <a href=\"https://github.com/decocms/mesh/pull/2098\">PR #2098</a> to add STDIO transport to Mesh:</p>\n<pre><code class=\"language-typescript\">// StdioConnectionManager spawns and manages local MCP processes\nconst proc = spawn(command, args, {\n  cwd: workingDirectory,\n  env: { ...process.env, ...envVars },\n  stdio: [&quot;pipe&quot;, &quot;pipe&quot;, &quot;pipe&quot;],\n});\n\n// Connect MCP client to the process streams\nconst transport = new StdioClientTransport({\n  reader: proc.stdout,\n  writer: proc.stdin,\n});\n</code></pre>\n<p>The implementation includes:</p>\n<ul>\n<li><strong>Process lifecycle management</strong> — spawn, monitor, restart on crash</li>\n<li><strong>NPX support</strong> — enter <code>@perplexity-ai/mcp-server</code> and it handles the rest</li>\n<li><strong>Environment variables</strong> — set API keys per connection</li>\n<li><strong>Log capture</strong> — stderr streams to the Mesh UI for debugging</li>\n</ul>\n<p>Now I could add any STDIO-based MCP server directly in the Mesh interface. Enter a command, set env vars, connect.</p>\n<h2>Part 3: The subarray Bug</h2>\n<p>With STDIO support working, I tried adding <code>@stabgan/openrouter-mcp-multimodal</code> — a community MCP that wraps OpenRouter&#39;s API. But it crashed immediately:</p>\n<pre><code>TypeError: this._buffer.subarray is not a function\n  at ReadBuffer.readMessage (stdio.js:18:37)\n</code></pre>\n<p>The stack trace pointed to the MCP SDK&#39;s STDIO transport. After digging through the code, I found the culprit: the OpenRouter MCP was calling <code>process.stdin.setEncoding(&#39;utf8&#39;)</code> during initialization.</p>\n<p>This seems harmless, but it&#39;s not. The MCP protocol sends binary-framed messages over STDIO. When you set the encoding to UTF-8, Node.js starts decoding the stream as text before the MCP SDK can read it. The <code>_buffer</code> that should hold raw bytes gets converted to a string, and strings don&#39;t have a <code>subarray</code> method.</p>\n<p>The fix was one line:</p>\n<pre><code class=\"language-diff\">- process.stdin.setEncoding(&#39;utf8&#39;);\n</code></pre>\n<p>I forked the repo, removed the offending line, and published it as <code>@firstdoit/openrouter-mcp-multimodal</code>. Now I could run OpenRouter locally too, with my own API key.</p>\n<h2>Part 4: Exa → Firecrawl</h2>\n<p>With local MCPs working, I turned back to my enrichment pipeline. The second step after Perplexity research was Exa content fetching. But Exa was giving me search results and snippets — not the full page content.</p>\n<p>When the LLM classifies a bookmark, I want it to see the actual article text. A 200-word snippet isn&#39;t enough to generate meaningful developer, founder, and investor insights.</p>\n<p>Firecrawl solves this. It scrapes the full page and returns clean markdown:</p>\n<pre><code class=\"language-typescript\">const result = await callMeshTool(&quot;firecrawl_scrape&quot;, {\n  url: bookmark.url,\n  formats: [&quot;markdown&quot;],\n  onlyMainContent: true,\n});\n</code></pre>\n<p>Firecrawl also gives me metadata like <code>publishedTime</code>, which I now extract and display in the UI. The enrichment pipeline became:</p>\n<ol>\n<li><strong>Perplexity</strong> — quick research: what is this, who made it, is it still active?</li>\n<li><strong>Firecrawl</strong> — full page content in markdown</li>\n<li><strong>Gemini 2.5 Flash</strong> — classify, rate, generate three-perspective insights</li>\n</ol>\n<p>Wait, Gemini? What happened to Claude Sonnet?</p>\n<h2>Part 5: Speed Optimization</h2>\n<p>The enrichment pipeline was taking 40-50 seconds per bookmark. Perplexity&#39;s deep research mode was thorough but slow. Claude Sonnet 4.5 was expensive and not much better than alternatives for this task.</p>\n<p>I made three changes:</p>\n<ol>\n<li><p><strong>Perplexity: deep → quick</strong> — Reduced the prompt, focused on key facts. Still useful research, but 3x faster.</p>\n</li>\n<li><p><strong>Claude Sonnet → Gemini 2.5 Flash</strong> — For classification, Gemini is faster and cheaper. The three-perspective insights (developer, founder, investor) come out just as differentiated.</p>\n</li>\n<li><p><strong>Trimmed the prompts</strong> — Less preamble, more direct instructions. The JSON parsing became more robust too — LLMs occasionally return malformed JSON, so I added regex extraction and comma fixes.</p>\n</li>\n</ol>\n<p>Result: <strong>15-20 seconds per bookmark</strong> instead of 40-50.</p>\n<h2>Part 6: SQLite Was Getting Heavy</h2>\n<p>At this point I had 400+ bookmarks, about 50 of them enriched. The <code>bookmarks.db</code> file was already 1.6MB and growing fast. Every git operation touched this blob. Every deploy pushed it to Cloudflare.</p>\n<p>The database was becoming a liability. I needed it somewhere else.</p>\n<p>Supabase was the obvious choice: free tier with 500MB, managed PostgreSQL, RLS for access control, and — conveniently — an MCP server I could run locally.</p>\n<p>I added <code>@supabase/mcp-server</code> as a STDIO connection in Mesh with my project credentials. Now I could run SQL queries, create tables, and set up RLS policies directly from Cursor. The migration took about 15 minutes:</p>\n<h3>Schema improvements</h3>\n<pre><code class=\"language-sql\">-- Renamed fields for clarity\n-- research_raw → perplexity_research\n-- exa_content → firecrawl_content\n\n-- Added full-text search\nALTER TABLE bookmarks ADD COLUMN search_vector TSVECTOR \n  GENERATED ALWAYS AS (\n    setweight(to_tsvector(&#39;english&#39;, coalesce(title, &#39;&#39;)), &#39;A&#39;) ||\n    setweight(to_tsvector(&#39;english&#39;, coalesce(description, &#39;&#39;)), &#39;B&#39;)\n  ) STORED;\n\n-- Added notes for personal annotations\nALTER TABLE bookmarks ADD COLUMN notes TEXT;\n</code></pre>\n<h3>RLS for public read, private write</h3>\n<pre><code class=\"language-sql\">-- Anyone can read\nCREATE POLICY &quot;Public read access&quot; ON bookmarks \n  FOR SELECT USING (true);\n\n-- Only service role can write\nCREATE POLICY &quot;Service role full access&quot; ON bookmarks \n  FOR ALL USING (auth.role() = &#39;service_role&#39;);\n</code></pre>\n<h3>Frontend reads directly from Supabase</h3>\n<pre><code class=\"language-typescript\">import { createClient } from &quot;@supabase/supabase-js&quot;;\n\nconst supabase = createClient(\n  import.meta.env.VITE_SUPABASE_URL,\n  import.meta.env.VITE_SUPABASE_ANON_KEY\n);\n\nexport async function getAllBookmarks() {\n  const { data } = await supabase.from(&quot;bookmarks&quot;).select(&quot;*&quot;);\n  return data;\n}\n</code></pre>\n<h3>Writes go through MCP</h3>\n<p>In development, writes route through the local Mesh gateway → Supabase MCP → PostgreSQL. No service keys exposed to the frontend. I built a small Vite plugin that proxies API calls to the Mesh gateway:</p>\n<pre><code>Frontend → Vite Dev Server → Mesh Gateway → Supabase MCP → PostgreSQL\n</code></pre>\n<p>Production is read-only. The anon key only has SELECT permissions.</p>\n<h2>Part 7: Back to a Lean Git</h2>\n<p>With bookmarks in Supabase, I could finally remove <code>bookmarks.db</code> from version control:</p>\n<pre><code class=\"language-bash\"># .gitignore\ndata/bookmarks.db*\n</code></pre>\n<p>The git repo went from 1.6MB+ of database blobs back to lean source code. Deploys are faster. <code>git status</code> is instant again.</p>\n<h2>Part 8: STDIO for vibegui.com</h2>\n<p>One last thing. I was still running <code>bun run mcp:dev</code> to start my blog&#39;s MCP server before using it in the mesh. Now that I had STDIO support, why not add a STDIO entry point to the blog itself?</p>\n<p>I created <code>mcp-stdio.ts</code>:</p>\n<pre><code class=\"language-typescript\">#!/usr/bin/env node\nimport { Server } from &quot;@modelcontextprotocol/sdk/server/index.js&quot;;\nimport { StdioServerTransport } from &quot;@modelcontextprotocol/sdk/server/stdio.js&quot;;\n\n// ... 34 tools: content CRUD, search, git, bookmarks, dev server ...\n\nconst transport = new StdioServerTransport();\nawait server.connect(transport);\n</code></pre>\n<p>This will work once I extend PR #2098 to support commands beyond <code>npx</code> — that&#39;s on the list for this week. Then I&#39;ll be able to add vibegui.com as a STDIO connection in Mesh with no separate terminal window.</p>\n<h2>The Results</h2>\n<table>\n<thead>\n<tr>\n<th>Before</th>\n<th>After</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Shared Perplexity API</td>\n<td>Own API key, full cost visibility</td>\n</tr>\n<tr>\n<td>HTTP-only MCP connections</td>\n<td>STDIO support for local servers</td>\n</tr>\n<tr>\n<td>Exa snippets</td>\n<td>Firecrawl full page content</td>\n</tr>\n<tr>\n<td>Claude Sonnet (40-50s/bookmark)</td>\n<td>Gemini Flash (15-20s/bookmark)</td>\n</tr>\n<tr>\n<td>1.6MB SQLite in git</td>\n<td>Supabase, zero database in git</td>\n</tr>\n</tbody></table>\n<h2>What&#39;s Next</h2>\n<ul>\n<li><strong>Vector embeddings</strong> — Supabase has <code>pgvector</code>, I added the column, just need to populate it</li>\n<li><strong>Full-text search UI</strong> — The <code>search_vector</code> column is ready</li>\n<li><strong>Notes feature</strong> — Personal annotations per bookmark</li>\n<li><strong>Extend STDIO PR</strong> — Support arbitrary commands, not just npx</li>\n</ul>\n<p>The code is at <a href=\"https://github.com/deco-cx/vibegui.com\">github.com/deco-cx/vibegui.com</a>. The Mesh STDIO PR is <a href=\"https://github.com/decocms/mesh/pull/2098\">#2098</a>.</p>\n<hr>\n<p><em>Built with Claude Opus 4.5 via MCP.</em></p>\n","layout":"prose","date":"2025-12-28","status":"published","tags":["tech:firecrawl","tech:mcp","tech:supabase","topic:vibecoding","type:devlog"],"coverImage":null}</script>
