    <script id="article-data" type="application/json">{"slug":"self-worth-and-investing-in-yourself-the-measure-of-your-value","locale":"en","translationKey":"linkedin:7260078257088196608","path":"/en/article/self-worth-and-investing-in-yourself-the-measure-of-your-value","alternatePath":"/article/autoestima-e-investimento-em-si-mesmo-a-medida-do-seu-valor","title":"Self-Worth and Investing in Yourself: The Measure of Your Value","description":"Why the exact measure of your self-esteem is how much you invest in your tools and in yourself.","html":"<p>The exact measure of your self-esteem is how much you invest in your tools and in yourself. What an interesting distinction.</p>\n<p>I always took great pride in being an economical and efficient person. When I built a computer, I did deep research on the cheapest parts with the best cost-benefit ratio. When I bought a car, I got a great used one. Phone? Android, obviously!</p>\n<p>I never allowed myself to have the best thing. I associated having the best thing with extravagance—it&#39;s a sin. Why have the best thing if I can get 80% of the result for 20% of the price by getting the third-best thing?</p>\n<p>At the beginning of this year, at 33, for the first time I bought <em>the best MacBook Pro available</em> with an obscene amount of memory that can run 700 Chrome tabs without breaking a sweat. I could have (financially) bought &quot;the best MacBook Pro available&quot; 5, or even 10 years ago. But I couldn&#39;t.</p>\n<p>Psychology has a term called &quot;self-efficacy&quot; which means the belief that you can depend on yourself and are capable of achieving results and overcoming problems. The more you recognize your own value, the more obvious it becomes to invest in yourself to have the best tools and conditions to overcome problems. This applies to all spheres of life—from computers to giving yourself time for your health and your family.</p>\n<p>The best thing you can do for the world, counterintuitively, is to learn to value yourself! After all, this is the only investment over which you have total control: your words, your actions, and your results.</p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_a-medida-exata-da-sua-auto-estima-%C3%A9-quanto-activity-7260078257088196608-9G1U\">LinkedIn</a> on November 7, 2024.</em></p>\n","layout":"prose","date":"2024-11-07","status":"published","tags":["growth","linkedin-import","mindset","self-development"],"coverImage":null}</script>
