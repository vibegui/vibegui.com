    <script id="article-data" type="application/json">{"slug":"beyond-make-something-people-want-building-what-people-would-kil","locale":"en","translationKey":"linkedin:7262185122689404930","path":"/en/article/beyond-make-something-people-want-building-what-people-would-kil/","title":"Beyond ''Make Something People Want'': Building What People Would Kill For","description":"\"Make something people want\" is NOT ENOUGH! If I knew how Paul Graham was subtly wrong with that sentence, it would''ve saved me years of building.","html":"<p>&quot;Make something people want&quot; is NOT ENOUGH! If I knew how Paul Graham was subtly wrong with that sentence, it would&#39;ve saved me and my company two years worth of building. Here&#39;s why:</p>\n<p>People <em>want</em> a lot of things, but they will hardly ever CHANGE HABITS over something unless it REALLY moves the needle in a very substantial way. This means you need to build something that people would KILL FOR, not merely want.</p>\n<p>The distinction is huge. When you are building something people would KILL FOR, they have a <em>violent</em> reaction when you first show it to them. They say things like: &quot;Can I use this right now?&quot; or &quot;How much do I have to pay?&quot;. They don&#39;t say &quot;yeah that sounds cool&quot;. They don&#39;t merely sign up for your waitlist. They sign up in droves and they MESSAGE you asking for an early invite.</p>\n<p>It&#39;s very hard, as a founder, to spend a few months building something and realizing that people want it, you can even sell it to them, but they don&#39;t want it ENOUGH to really create a tidal wave of pulling. It&#39;s very hard to admit to yourself that this dear thing you&#39;ve labored over for months is not THAT amazing.</p>\n<p>But this is the most effective pill you have to swallow in order to LET GO of this thing you built and start falling in love with a POSSIBILITY for a NEW PROBLEM, a NEW CATEGORY that literally doesn&#39;t exist yet, but you are well positioned to articulate — and address. This new category, once existing, creates a MASSIVE demand, instantly! Because the demand was <em>already there</em>, but it was poorly or not-at-all articulated.</p>\n<p>We spent two years at deco trying to be <em>better</em> than other CMS&#39;s, <em>better</em> than Vercel, <em>better</em> than Optimizely — and do it all at once, lol! We ended up even excelling at some of those things, arguably being 2-3x better than some of those in different aspects. But that doesn&#39;t matter. It&#39;s not enough.</p>\n<p>Now, Webdraw is a completely different beast. We are solving <em>precisely</em> the same problem: allowing people to express themselves through web software. But before, we were constrained by the current rules of the game: if you want to have custom software, you will need dedicated software developers. And you can make it as easy as you want, they are still 0.001% of the population!</p>\n<p>Now, you can just <em>build custom software yourself</em>. Really, complex, working online SaaS-like web apps. That talk to actual databases. That can read and write from Google Sheets. That can interact with Airtable or Oracle or SAP.</p>\n<p>This literally means that businesses will be able to evolve their software on a DAILY basis, not on sprints or months or years. People will evolve the software they use themselves, all the time.</p>\n<p>Now THAT&#39;s not 3x better. That is a whole new category. It solves the same problem, but making 1000x more people powerful. So I hope you can let go of your initial idea as quickly as possible!</p>\n<p>The REAL idea lies just ahead. As soon as you let go.</p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_webdraw-alpha-draw-to-code-platform-activity-7262185122689404930-Er4k\">LinkedIn</a> on November 12, 2024.</em></p>\n","layout":"prose","date":"2024-11-12","status":"published","tags":["linkedin-import","product","startups"],"coverImage":null}</script>
