    <script id="article-data" type="application/json">{"slug":"the-disadvantage-of-thinking-you-re-important","locale":"en","translationKey":"linkedin:7298715701681258496","path":"/en/article/the-disadvantage-of-thinking-you-re-important/","alternatePath":"/article/a-desvantagem-de-se-achar-importante/","title":"The Disadvantage of Thinking You're Important","description":"Why letting go of your self-importance is the key to infinite possibilities.","html":"<p>I feel sorry for people who go through life thinking they&#39;re very important. It&#39;s a massive disadvantage I carried for a long time. If you take yourself too seriously, you lose the ability to remain open to learning simple things that contradict your sense of importance.</p>\n<p>I spent this week in New York talking with (half of) the world&#39;s largest funds. The smartest investors listen with total commitment, without needing to be important. Just wanting to discover what there is to discover in the conversation.</p>\n<p>And the less importance I give myself in the conversation, the more I can authentically learn from their opinions and questions. I&#39;ve reinvented myself about three times this week, each time throwing out the window things that, if I were important, I would want to defend with everything I had. Thank God I&#39;m not that important! What&#39;s important is building the largest consumer AI network on the planet.</p>\n<p>Thinking you&#39;re important means being defined by your past—which is poverty, given that it&#39;s limited. </p>\n<p>I am defined by my future. And it is infinite in possibilities.</p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_eu-tenho-pena-de-quem-vive-achando-que-%C3%A9-activity-7298715701681258496-ptlu\">LinkedIn</a> on February 21, 2025.</em></p>\n","layout":"prose","date":"2025-02-21","status":"published","tags":["humility","leadership","linkedin-import","mindset"],"coverImage":null}</script>
