    <script id="article-data" type="application/json">{"slug":"hello-world-building-an-mcp-native-blog","locale":"en","translationKey":"article:hello-world-building-an-mcp-native-blog","path":"/en/article/hello-world-building-an-mcp-native-blog/","title":"Hello World: Building an MCP-Native Blog","description":"Welcome to vibegui.com — a personal blog built entirely through MCP, served at the edge with sub-100KB payloads.","html":"<p>Welcome to <strong>vibegui.com</strong> — my personal blog, experiment sandbox, and a demonstration of what&#39;s possible when you build content-first with MCP (Model Context Protocol).</p>\n<p>This post documents what we actually built: a fully MCP-native publishing platform where every piece of content flows through AI-accessible tools, deploys to Cloudflare Pages in under 20 seconds, and respects strict performance constraints verified by automated tests.</p>\n<h2>The Stack</h2>\n<ul>\n<li><strong>Vite + React 19</strong> — with React Compiler</li>\n<li><strong>Tailwind CSS v4</strong> — utility-first styling with design tokens</li>\n<li><strong>Bun</strong> — fast runtime and test runner</li>\n<li><strong>Playwright</strong> — E2E tests for accessibility, responsive design, and performance</li>\n<li><strong>MCP Server</strong> — local TypeScript server exposing tools for content management</li>\n<li><strong>Cloudflare Pages</strong> — edge deployment with intelligent caching</li>\n</ul>\n<h2>Architecture: MCP All The Way Down</h2>\n<pre><code>┌─────────────────────────────────────────────────────────────────┐\n│                    MCP Server (main.ts)                         │\n├─────────────────────────────────────────────────────────────────┤\n│  COLLECTIONS                                                    │\n│  ├── Ideas      → Quick thoughts, captured in seconds           │\n│  ├── Research   → Deep dives, LLM-generated topic stubs         │\n│  ├── Drafts     → Work in progress                              │\n│  └── Articles   → Published content (you&#39;re reading one!)       │\n├─────────────────────────────────────────────────────────────────┤\n│  DEV TOOLS (auto-generated from package.json)                   │\n│  ├── SCRIPT_DEV      → Start Vite dev server                    │\n│  ├── SCRIPT_BUILD    → Production build                         │\n│  ├── SCRIPT_TEST     → Run unit tests                           │\n│  ├── SCRIPT_TEST_E2E → Run Playwright tests                     │\n│  └── SCRIPT_PRECOMMIT → Full CI pipeline locally                │\n├─────────────────────────────────────────────────────────────────┤\n│  SEARCH TOOLS (ripgrep-powered)                                 │\n│  ├── SEARCH_CONTENT  → Find patterns in articles                │\n│  ├── SEARCH_CONTEXT  → Search reference materials               │\n│  └── SEARCH_ALL      → Search everything                        │\n├─────────────────────────────────────────────────────────────────┤\n│  GIT TOOLS                                                      │\n│  ├── GIT_STATUS      → See what changed                         │\n│  ├── COMMIT          → Stage all + commit                       │\n│  └── PUSH            → Push to remote                           │\n└─────────────────────────────────────────────────────────────────┘\n                              │\n                              ▼\n┌─────────────────────────────────────────────────────────────────┐\n│                   Cloudflare Pages (Edge)                       │\n│   • Pre-built dist/ folder (no npm install on CF!)              │\n│   • Content-hash URLs → 1 year immutable cache                  │\n│   • HTML → 30s cache, 1h stale-while-revalidate                 │\n└─────────────────────────────────────────────────────────────────┘\n</code></pre>\n<h2>Resilient Deploys: No npm, No Problem</h2>\n<p>I&#39;ve grown paranoid about non-reproducible builds.</p>\n<p>npm registries go down. esm.sh has outages. Package versions get yanked. Transitive dependencies break in ways you didn&#39;t expect. I&#39;ve seen production deploys fail because a CDN couldn&#39;t resolve a package that worked fine 10 minutes ago.</p>\n<p>For a personal blog that I want to last for years, I wanted <strong>complete resilience</strong>. No external dependencies at deploy time. No network calls to package registries. Just static files.</p>\n<p>The solution: <strong>build locally, commit the <code>dist/</code> folder, deploy only what&#39;s already built.</strong></p>\n<h3>How It Works</h3>\n<ol>\n<li><p><strong>Pre-commit hook</strong> (via Lefthook) runs the full CI pipeline locally:</p>\n<ul>\n<li>Format with Biome</li>\n<li>Lint with oxlint</li>\n<li>TypeScript check</li>\n<li>Vite build → produces <code>dist/</code></li>\n<li>Stage <code>dist/</code> automatically</li>\n<li>Run constraint tests</li>\n<li>Run E2E tests with Playwright</li>\n</ul>\n</li>\n<li><p><strong>Everything is verified before it leaves my machine.</strong> If the E2E tests fail, the commit is rejected. No broken deploys.</p>\n</li>\n<li><p><strong>Cloudflare Pages config</strong>:</p>\n<ul>\n<li>Build command: <code>npm run pages:build</code> (just copies markdown files to <code>dist/</code>)</li>\n<li>Build output: <code>dist</code></li>\n<li>Environment variable: <code>SKIP_DEPENDENCY_INSTALL=true</code></li>\n</ul>\n</li>\n</ol>\n<p>The key insight: since <code>dist/</code> is already complete and tested, Cloudflare doesn&#39;t need to run npm install at all. I can skip dependency installation entirely. The deploy becomes a simple file copy.</p>\n<pre><code class=\"language-bash\"># What happens on every commit\n$ git commit -m &quot;New article&quot;\n\n╭───────────────────────────────────────╮\n│ 🥊 lefthook v1.13.6  hook: pre-commit │\n╰───────────────────────────────────────╯\n✔️ 1_format (0.05s)\n✔️ 2_lint (0.06s)\n✔️ 3_typecheck (1.31s)\n✔️ 4_build (0.72s)      ← Vite builds in &lt;1s\n✔️ 5_stage (0.01s)      ← dist/ is staged\n✔️ 6_constraints (0.03s)\n✔️ 7_e2e (6.47s)\n\n# Push → CF deploys in ~15s (just copies files, no npm)\n</code></pre>\n<p>The side effect is speed — deploys take 15-20 seconds instead of 2-3 minutes — but the real win is reliability. My blog will deploy correctly even if npm is having a bad day.</p>\n<h2>Constraint-Driven Development</h2>\n<p>Performance isn&#39;t aspirational — it&#39;s enforced. We have automated tests that fail the build if constraints are violated:</p>\n<h3>Build Size Constraints</h3>\n<pre><code class=\"language-typescript\">// tests/constraints/build-size.test.ts\ntest(&quot;index.html compressed size &lt; 100KB&quot;, async () =&gt; {\n  const html = await Bun.file(&quot;dist/index.html&quot;).text();\n  const compressed = Bun.gzipSync(new TextEncoder().encode(html));\n  expect(compressed.length).toBeLessThan(100 * 1024);\n});\n\ntest(&quot;app code (non-vendor) &lt; 50KB&quot;, async () =&gt; {\n  // Ensures our actual code stays small\n  // Vendor chunks (React, markdown parser) are separate\n});\n</code></pre>\n<h3>Image Constraints</h3>\n<p>Every image in <code>public/</code> and <code>content/</code> must be under 250KB. A pre-commit optimization script runs Sharp to resize and compress.</p>\n<h3>Content-Hash Everything</h3>\n<p>Every asset is named with a content hash — not just JS and CSS, but <strong>articles and markdown too</strong>:</p>\n<ul>\n<li><code>index.A1B2C3D4.js</code> — app bundle</li>\n<li><code>hello-world.5de02914.md</code> — article content</li>\n<li><code>manifest.215efd59.json</code> — content manifest</li>\n</ul>\n<p>If the content doesn&#39;t change, the hash doesn&#39;t change, and the filename stays the same. This means <strong>deploys only invalidate what actually changed</strong>. Publish a new article? Only the manifest and that article get new hashes. Everything else stays cached.</p>\n<p>The manifest hash is injected into <code>index.html</code> at build time:</p>\n<pre><code class=\"language-html\">&lt;script&gt;window.__MANIFEST_PATH__=&quot;/content/manifest.215efd59.json&quot;;&lt;/script&gt;\n</code></pre>\n<p>The app reads this on load, fetches the manifest, and uses the hashed article paths. Everything except <code>index.html</code> gets <code>Cache-Control: public, max-age=31536000, immutable</code>.</p>\n<p>Here&#39;s the clever part: we don&#39;t commit the hashed content files. The source markdown lives in <code>content/</code> and <code>context/</code>, and the Vite plugin generates a manifest with pre-computed hashes. On Cloudflare Pages, the <code>pages:build</code> script reads those hashes and copies files to <code>dist/</code> with hashed names. No duplication in git, and the hashing is deterministic — same content always produces the same hash.</p>\n<h2>The Context System</h2>\n<p>Beyond articles, the site includes a <strong>Context</strong> section: LLM-generated summaries of papers and books that inform my thinking. These aren&#39;t reproductions — they&#39;re interpretive notes that help me internalize concepts.</p>\n<p>The MCP server exposes <code>SEARCH_CONTEXT</code> to find relevant references while writing:</p>\n<pre><code class=\"language-typescript\">// Find references to &quot;integrity&quot; across all context files\nSEARCH_CONTEXT({ pattern: &quot;integrity&quot;, contextLines: 5 })\n</code></pre>\n<p>This powers AI-assisted writing where the agent can pull in relevant context from my reading notes.</p>\n<h2>What I Learned</h2>\n<h3>1. Pre-built Deploys Are Underrated</h3>\n<p>The mental model shift: treat <code>dist/</code> as a first-class artifact. Version it. Test it. Deploy it directly. Your CI becomes your local machine, and deploys become file copies.</p>\n<h3>2. MCP Makes AI-First Natural</h3>\n<p>When every action is a tool call, there&#39;s no context switching. Write prose → call <code>COLLECTION_ARTICLES_CREATE</code> → call <code>COMMIT</code> → call <code>PUSH</code>. The agent does it all. This entire article was written through MCP tools.</p>\n<h3>3. Cloudflare&#39;s JSON and MD Caching Quirk</h3>\n<p>JSON and Markdown files return <code>Cf-Cache-Status: DYNAMIC</code> by default, even with proper <code>Cache-Control</code> headers. The fix: setup a Cache Rule in the dashboard with the correct path and mark &quot;eligible for cache&quot;.</p>\n<h2>The Road Ahead</h2>\n<p>This blog will document:</p>\n<ul>\n<li><strong>MCP patterns</strong> — what works, what doesn&#39;t, how to structure agent-first applications</li>\n<li><strong>Agentic workflows</strong> — connecting Exa, Perplexity and others in my MCP Mesh to create powerful workflows</li>\n<li><strong>deco CMS</strong> — the platform I&#39;m building to democratize AI-powered software creation  </li>\n<li><strong>Brazil&#39;s tech future</strong> — my commitment to making Brazil a global technology protagonist</li>\n<li><strong>The meta-journey</strong> — building in public, with AI, through MCP</li>\n</ul>\n<p>Every article you read here was created, edited, and published through the same MCP tools you could use yourself.</p>\n<p>The source is at <a href=\"https://github.com/vibegui/vibegui.com\">github.com/vibegui/vibegui.com</a>. Star it, fork it, make it yours.</p>\n<p>This is a living experiment! I will write more on it as it evolves.</p>\n<hr>\n<p><em>This article and blog was authored collaboratively with Claude Opus 4.5 via MCP. Total time from idea to published: ~6 hours of vibe coding.</em></p>\n","layout":"prose","date":"2025-12-21","status":"published","tags":["architecture","edge","hello-world","mcp","performance"],"coverImage":null}</script>
