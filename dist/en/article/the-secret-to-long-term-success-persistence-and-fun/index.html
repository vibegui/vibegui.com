    <script id="article-data" type="application/json">{"slug":"the-secret-to-long-term-success-persistence-and-fun","locale":"en","translationKey":"linkedin:7320565301945819136","path":"/en/article/the-secret-to-long-term-success-persistence-and-fun","alternatePath":"/article/o-segredo-do-sucesso-a-longo-prazo-persistencia-e-diversao","title":"The Secret to Long-Term Success: Persistence and Fun","description":"Why building a billion-dollar company requires finding the tribe you want to survive hardships with—and learning to enjoy the journey.","html":"<p>&quot;If it were easy, any idiot would do it.&quot; Rafael Crespo burst out laughing when I said this today, because it&#39;s a simple truth. Building a billion-dollar company requires you to &quot;align stars and keep them aligned.&quot;</p>\n<p>Finding stars to align is already hard. Keeping them continuously aligned, through the ups and downs, is even harder. But this is exactly what separates champion teams (and individuals) from those who fail: champions don&#39;t give up in the middle and survive the most diverse tribulations, until eventually finding success (the famous 10-year-long overnight success).</p>\n<p>I spent 9 years at VTEX aligned with the vision of Geraldo Thomaz and Mariano Gomide de Faria. Many people were there at the same time as me, but gave up for whatever reasons (no judgment!). Having survived several crises we had, as all startups do, I had the privilege of reaping the rewards: I was a partner in an NYSE IPO, one of only 34 Brazilian companies publicly traded there (a very small number).</p>\n<p>&quot;The night is darkest before the dawn.&quot;</p>\n<p>Human beings never do something with discipline and consistency unless they decide to interpret it as fun and rewarding. Only those who enjoy and find fulfillment surviving short-term setbacks can reap the long-term rewards.</p>\n<p><strong>The important thing is to find the tribe of people you want to survive hardships with for a long period of time!</strong> Once you find them, trust the process. Big things take time.</p>\n<hr>\n<p><em>Originally published on <a href=\"https://www.linkedin.com/posts/vibegui_se-fosse-f%C3%A1cil-qualquer-idiota-faria-activity-7320565301945819136-M99A\">LinkedIn</a> on April 22, 2025.</em></p>\n","layout":"prose","date":"2025-04-22","status":"published","tags":["leadership","linkedin-import","persistence","startup"],"coverImage":null}</script>
