    <script id="article-data" type="application/json">{"slug":"shipping-vibegui-bookmarks-v1-architecture-costs-and-lessons","locale":"en","translationKey":"article:shipping-vibegui-bookmarks-v1-architecture-costs-and-lessons","path":"/en/article/shipping-vibegui-bookmarks-v1-architecture-costs-and-lessons/","title":"Shipping vibegui Bookmarks v1: Architecture, Costs, and Lessons","description":"How I built an AI-enriched bookmark manager using MCP, Gemini Flash, Firecrawl, and Perplexity — and what it cost to enrich 305 bookmarks.","html":"<p>I just shipped <a href=\"/bookmarks\">vibegui Bookmarks</a> — an AI-enriched bookmark manager that analyzes every link I save and generates tailored insights for three personas: developers, founders, and investors.</p>\n<p>Here&#39;s what I built, how much it cost, and what I learned.</p>\n<h2>What It Does</h2>\n<p>Every bookmark goes through an enrichment pipeline:</p>\n<ol>\n<li><strong>URL saved</strong> → stored in Supabase (PostgreSQL)</li>\n<li><strong>Content scraped</strong> → Firecrawl extracts the full page content</li>\n<li><strong>Context added</strong> → Perplexity searches for additional info (author background, related projects)</li>\n<li><strong>Analysis generated</strong> → Gemini Flash 2.5 produces structured insights</li>\n</ol>\n<p>The output includes:</p>\n<ul>\n<li>Title, description, and icon</li>\n<li>1-5 star rating</li>\n<li>Tags for filtering (type, tech stack, platform, topic)</li>\n<li>Tailored insights for each persona</li>\n</ul>\n<h2>Architecture</h2>\n<pre><code>┌─────────────┐     ┌─────────────┐     ┌─────────────┐\n│   Browser   │────▶│  MCP Mesh   │────▶│  Supabase   │\n│  Extension  │     │   Gateway   │     │  PostgreSQL │\n└─────────────┘     └──────┬──────┘     └─────────────┘\n                           │\n              ┌────────────┼────────────┐\n              ▼            ▼            ▼\n        ┌──────────┐ ┌──────────┐ ┌──────────┐\n        │ Firecrawl│ │Perplexity│ │OpenRouter│\n        │  (scrape)│ │ (search) │ │ (analyze)│\n        └──────────┘ └──────────┘ └──────────┘\n</code></pre>\n<p><strong>Services:</strong></p>\n<ul>\n<li><a href=\"https://github.com/decocms/mesh\">MCP Mesh</a> — MCP gateway for orchestrating AI tools</li>\n<li><a href=\"https://firecrawl.dev\">Firecrawl</a> — Web scraping API</li>\n<li><a href=\"https://perplexity.ai\">Perplexity</a> — Search API for context enrichment</li>\n<li><a href=\"https://openrouter.ai\">OpenRouter</a> — Multi-model LLM gateway (using Gemini Flash 2.5)</li>\n</ul>\n<p>The frontend is a React SPA with:</p>\n<ul>\n<li>Filterable table (by track, tech, type, platform, rating)</li>\n<li>Full-text search</li>\n<li>Modal detail view with insights per persona</li>\n<li>Mobile-friendly card layout</li>\n<li>Bulk re-enrichment controls</li>\n</ul>\n<p>Everything runs through MCP (Model Context Protocol) via a custom gateway, letting me orchestrate tool calls between Firecrawl, Perplexity, and OpenRouter from a single interface.</p>\n<h2>The Cost Breakdown</h2>\n<p>For 305 enriched bookmarks:</p>\n<table>\n<thead>\n<tr>\n<th>Service</th>\n<th>Usage</th>\n<th>Cost</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>OpenRouter (Gemini Flash)</strong></td>\n<td>358 calls, 5.3M tokens</td>\n<td>$2.64</td>\n</tr>\n<tr>\n<td><strong>Firecrawl</strong></td>\n<td>395 of 3,000 credits/mo</td>\n<td>~$2.50 (of $19/mo)</td>\n</tr>\n<tr>\n<td><strong>Perplexity</strong></td>\n<td>488 requests, 354K tokens</td>\n<td>$7.56</td>\n</tr>\n<tr>\n<td><strong>Total</strong></td>\n<td>—</td>\n<td><strong>~$12.70</strong></td>\n</tr>\n</tbody></table>\n<p>That&#39;s <strong>$0.04 per bookmark</strong> for full page scraping, web search context, and LLM analysis.</p>\n<p>Gemini Flash 2.5 is absurdly cheap for structured output. Most calls used 10-15K input tokens (scraped page content) and generated ~1K output tokens (JSON with insights). The largest single call processed 612K input tokens for $0.19.</p>\n<h2>What I Delivered</h2>\n<ul>\n<li>✅ Browser extension to save bookmarks</li>\n<li>✅ Enrichment pipeline (scrape → search → analyze)</li>\n<li>✅ Structured output with persona-specific insights</li>\n<li>✅ Filterable/searchable web UI</li>\n<li>✅ Mobile-responsive card layout</li>\n<li>✅ 305 bookmarks enriched and ready to browse</li>\n</ul>\n<h2>Bugs Squashed Along the Way</h2>\n<p>Building this wasn&#39;t smooth. A few issues I fixed today:</p>\n<p><strong>SQL Escaping</strong> — Insights with backslashes broke PostgreSQL queries. Switched from manual quote escaping to dollar-quoting (<code>$$text$$</code>).</p>\n<p><strong>LLM Output Truncation</strong> — Some insights ended mid-sentence. The OpenRouter MCP didn&#39;t expose <code>max_tokens</code>, so I forked the package, added the parameter, and published v1.6.0 to npm. Set it to 16K for Gemini Flash.</p>\n<p><strong>JSON Parsing Failures</strong> — The LLM sometimes returned malformed JSON (literal newlines in strings, unescaped quotes). Instead of patching with regex, I simplified the prompt to request arrays instead of complex pipe-separated strings:</p>\n<pre><code class=\"language-json\">// Before: fragile\n{ &quot;insight_dev&quot;: &quot;- Bullet 1. | - Bullet 2. | - Bullet 3.&quot; }\n\n// After: robust\n{ &quot;insight_dev&quot;: [&quot;Paragraph 1.&quot;, &quot;Paragraph 2.&quot;, &quot;Paragraph 3.&quot;] }\n</code></pre>\n<p><strong>Prompt Sharpening</strong> — The original prompt was verbose. I condensed the JSON rules, added &quot;CRITICAL&quot; emphasis for key constraints, and shortened paragraph targets from 3-5 sentences to 2-4. Result: denser, sharper insights.</p>\n<h2>Lessons Learned</h2>\n<ol>\n<li><p><strong>LLM output is never guaranteed</strong> — Even with strict prompts, you need parsing fallbacks and retry logic. But don&#39;t over-engineer regex fixes; simplify the output format instead.</p>\n</li>\n<li><p><strong>Own your dependencies</strong> — Forking the OpenRouter MCP meant I could add <code>max_tokens</code> in 10 minutes instead of waiting for an upstream PR.</p>\n</li>\n<li><p><strong>Token costs are predictable</strong> — Gemini Flash at $0.075/M input and $0.30/M output means I can estimate costs before running batch jobs.</p>\n</li>\n<li><p><strong>MCP orchestration is powerful</strong> — Having Firecrawl, Perplexity, and OpenRouter as tools in a unified gateway makes building AI pipelines feel like composing functions.</p>\n</li>\n<li><p><strong>Start with the data</strong> — The bookmark database schema came first. Everything else (scraping, enrichment, UI) was built to serve that data model.</p>\n</li>\n</ol>\n<h2>What&#39;s Next</h2>\n<ul>\n<li>RSS feed integration for auto-importing links</li>\n<li>Embedding-based semantic search</li>\n<li>Weekly digest emails with top bookmarks</li>\n<li>Public sharing for curated collections</li>\n</ul>\n<p>For now, v1 is live at <a href=\"/bookmarks\">/bookmarks</a>. Browse away.</p>\n","layout":"prose","date":"2025-12-29","status":"published","tags":["tech:llm","tech:mcp","tech:supabase","topic:ai-tools","topic:architecture","type:launch"],"coverImage":null}</script>
